theme = "blowfish"
baseURL = "https://ohwowbill.com/"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
summaryLength = 60
hasCJKLanguage = true

buildDrafts = false
buildFuture = false
enableEmoji = true

[pagination]
  pagerSize = 10

[imaging]
  anchor = 'Center'

# 文章只用 categories，不打 tags；「tags」若开着会生成一个空的 /tags/ 页。
[taxonomies]
  category = "categories"

# 旧站（Hugo Stack）正文大量使用裸 HTML 与自定义短代码。
# Hugo 默认 unsafe=false 会静默吞掉这些标记 —— 2024 年迁移时
# 正文段落、下划线强调、问答卡片、对话气泡的丢失皆源于此。
# 本站内容均为自撰，开启无第三方 HTML 风险。
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

# 相关文章：同系列的排最前，其次同类目，再其次年月相近。
# includeNewer 要开：默认只推「比本篇旧」的，早年的文章就永远推不到后来的同类。
[related]
  threshold = 0
  toLower = false
  includeNewer = true

  [[related.indices]]
    name = "series"
    weight = 150

  [[related.indices]]
    name = "categories"
    weight = 100

  [[related.indices]]
    name = "date"
    weight = 10

# 文章配图放在 static/img/（网址 /img/x.jpg 不变）。把这个目录同时挂进 assets，
# 图片渲染钩子（layouts/_default/_markup/render-image.html）才能拿到原图去出小尺寸 webp。
# 给某个目标另加挂载后，Hugo 不再自动挂它的默认目录，所以 assets 本身也要写上。
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/img"
    target = "assets/img"
