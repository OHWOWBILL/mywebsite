# ===========================================================
# 五术门庭 · /wushu/（layouts/_default/wushu.html）
#
# 山、医、命、卜、相，一术一门。
# 文章按 categories 进门：带上任一列出的分类就会出现在这扇门里，
# 一篇可以同时进几扇门（例如又命又卜）。
# 最省事的写法：分类里直接写单字「山」「医」「命」「卜」「相」。
#
# 门里既没有文章也没有法宝时，门扇合着，贴「门未开」封条，
# 并显示 shut 那句话。
#
# order = 门里文章排序，"desc" 新在前（默认）／"asc" 旧在前（成系列的）
# lamp = 门里那盏灯：开页时按此刻现算的一行字（assets/js/qj/wushu.js），
#        可选 moon / liuzhu / changsheng / gua / feixing，留空就不点灯。
# ===========================================================

# 山＝堪舆风水。分类只认「山」；有了「堪舆」这件法宝，门就开了。
[[door]]
  seal = "山"
  name = "堪舆"
  blurb = "堪舆风水：玄空飞星、八宅、罗盘；九星气学看方位"
  categories = ["山"]
  lamp = "feixing"
  shut = "此门尚封，时至自开。"
  [[door.tools]]
    seal = "玄"
    name = "堪舆"
    href = "/kanyu/"
    desc = "玄空飞星下卦替卦、流年流月、八宅命卦、手机罗盘"
  [[door.tools]]
    seal = "九"
    name = "九星气学"
    href = "/jiuxing/"
    desc = "本命星月命星，年盘月盘吉方凶方，搬家出行看方位"

[[door]]
  seal = "医"
  name = "方脉针灸"
  blurb = "中医经典，条文必背，医案逐条拆解；针灸按时取穴，体质辨识"
  categories = ["医"]
  order = "asc"
  lamp = "liuzhu"
  [[door.tools]]
    seal = "注"
    name = "子午流注"
    href = "/ziwu/"
    desc = "按此刻排纳子、纳甲、灵龟、飞腾四法开穴"
  [[door.tools]]
    seal = "气"
    name = "五运六气"
    href = "/yunqi/"
    desc = "查一年岁运、司天在泉、六步主客"
  [[door.tools]]
    seal = "质"
    name = "体质辨识"
    href = "/tizhi/"
    desc = "九种体质问卷（中华中医药学会标准），附调养"

[[door]]
  seal = "命"
  name = "推命"
  blurb = "八字、紫微、星盘诸法互证"
  categories = ["命"]
  lamp = "changsheng"
  # 八字、紫微、占星、合盘、姓名都并在命部里切换，这里只挂一件；读盘锁在八字、占星两页里
  [[door.tools]]
    seal = "参"
    name = "命部 · 星命同参"
    href = "/bazi/"
    desc = "八字、紫微、占星、合盘、姓名一处切换，存过的人一点就换；八字、占星里的读盘持诀可开"
  [[door.tools]]
    seal = "名"
    name = "姓名学"
    href = "/xingming/"
    desc = "五格剖象与三才，康熙笔画，几个候选名一起比"
  [[door.tools]]
    seal = "生"
    name = "十二长生"
    href = "/changsheng/"
    desc = "天干 × 地支旺衰速查"

[[door]]
  seal = "卜"
  name = "占断"
  blurb = "以梅花易数为主，兼及六爻、三式；通书选吉，灵签问神"
  categories = ["卜"]
  lamp = "gua"
  [[door.tools]]
    seal = "梅"
    name = "梅花"
    href = "/meihua/"
    desc = "此刻起卦，本互变卦并排"
  [[door.tools]]
    seal = "爻"
    name = "六爻纳甲"
    href = "/liuyao/"
    desc = "三钱摇卦，纳甲装卦，月建日辰逐爻标注"
  [[door.tools]]
    seal = "蓍"
    name = "大衍筮法"
    href = "/dayan/"
    desc = "四十九策分二挂一、揲四归奇，十八变成卦，按朱熹变占取辞"
  [[door.tools]]
    seal = "奇"
    name = "奇门手记"
    href = "/qimen/"
    desc = "起局看白话断语，记反馈、写复盘"
  [[door.tools]]
    seal = "壬"
    name = "大六壬"
    href = "/liuren/"
    desc = "月将加时，四课三传，十二天将"
  [[door.tools]]
    seal = "诀"
    name = "金口诀"
    href = "/jinkou/"
    desc = "点方位定地分，人元贵神将神四位，一课断一事"
  [[door.tools]]
    seal = "乙"
    name = "太乙神数"
    href = "/taiyi/"
    desc = "年计时计，主客算与格局"
  [[door.tools]]
    seal = "签"
    name = "灵签"
    href = "/lingqian/"
    desc = "掷筊三圣杯，摇签筒，签诗附白话"
  [[door.tools]]
    seal = "历"
    name = "通书 · 黄历择日流年"
    href = "/huangli/"
    desc = "黄历宜忌与吉时，按事项挑日子、排候选时间，一年流年方位"

[[door]]
  seal = "相"
  name = "观形"
  blurb = "面相、手相"
  categories = ["相"]
  shut = "暂未成文，问之可也。"
  [[door.tools]]
    seal = "禁"
    name = "相部"
    href = "/xiangbu/"
    desc = "韦千里相法读书卡、流年速查与字相九宫，持诀者可开"
