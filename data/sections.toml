# ===========================================================
# 「万法归一」主题分区 · 策展配置
#
# 规则：文章按 categories 归入**第一个**命中的分区（顺序即优先级）。
#       一篇都不命中的落入末尾的「散记」。
#       新文章只要带上已有分类就自动归位，不需要改这个文件。
#
# seal  = 印章上的字（一个汉字）
# order = 组内排序，"desc" 新在前（默认）／"asc" 旧在前（适合成系列的）
# ===========================================================

[[group]]
  seal = "玄"
  name = "玄学术数"
  blurb = "亲历、占断、与山中相识者"
  categories = ["玄学", "命", "工具", "知识点做题法"]
  order = "desc"

[[group]]
  seal = "医"
  name = "医道"
  blurb = "必背、医案、逐条拆解"
  categories = ["医", "医案", "必背"]
  order = "asc"

[[group]]
  seal = "文"
  name = "词章译读"
  blurb = "诗、词、与波斯语的逐字功夫"
  categories = ["诗词", "语言", "波斯语", "词根词缀", "语法"]
  order = "asc"

[[group]]
  seal = "思"
  name = "模型与人性"
  blurb = "把人拆开看的那些尝试"
  categories = ["模型", "人性", "问答"]
  order = "desc"

[[group]]
  seal = "异"
  name = "异闻"
  blurb = "白狐、列车、说不清的事"
  categories = ["异闻录", "相片故事"]
  order = "desc"

[[group]]
  seal = "旧"
  name = "过客时期"
  blurb = "旧站迁入，存其原貌"
  categories = ["过客文章"]
  order = "asc"

# 兜底分区：以上全不命中的落到这里
[fallback]
  seal = "散"
  name = "散记"
  blurb = "尚未归类者"
