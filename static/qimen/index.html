<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>奇门手记 · 潜蛟阁法宝库</title>
<meta name="description" content="奇门起局与判例库：按此刻起局，写下断语封盘，次日复盘归因，判例可导出。">
<link rel="icon" href="/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=LXGW+WenKai+TC&family=Archivo:wdth,wght@125,500;125,800&display=swap">

<style>
/* 奇门手记 · 盘面与表单（外框见 /fabao/fabao.css） */
:root{ --qi:#E7C77E; }  /* 三奇：淡金，比局数那一处金轻一档 */

/* ---------- 此刻面板里的局 ---------- */
.qm-sub{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.qm-sub .sep{color:var(--faint)}
.qm-sub b{color:var(--fg);font-weight:400;font-family:var(--font-title)}
.override{display:none;gap:8px;align-items:center}
.override.on{display:flex}
.override select{flex:1}

/* ---------- 布局：左盘右记 ---------- */
.qm-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.qm-chart-card{padding:14px;position:sticky;top:calc(var(--top-h) + 16px)}
.qm-key{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;margin-top:10px;font-size:12px;color:var(--faint);letter-spacing:.05em}
.qm-key i{font-style:normal;display:inline-block;padding:0 4px;margin-right:4px;border-radius:2px;font-size:11px;line-height:16px}
.qm-side .fb-seg{display:flex;width:100%}
.qm-side .fb-seg button{padding:8px 0;font-size:14px}

/* ---------- 盘 ---------- */
.chart{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:520px;margin:0 auto}
.palace{
  background:var(--bg-3);border:1px solid var(--rule-2);border-radius:8px;
  aspect-ratio:1;position:relative;padding:8px 9px;
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  font-family:var(--font-title);
}
.palace .god{font-size:.72rem;color:var(--zi-2);letter-spacing:.08em}
.palace .starline{font-size:1.05rem;line-height:1.25;color:var(--fg)}
.palace .starline .stem{margin-left:4px;font-weight:600;color:var(--fg)}
.palace .starline .stem.qi{color:var(--qi)}
.palace .door{font-size:1rem;color:var(--qing);letter-spacing:.03em}
.palace .earthstem{position:absolute;right:9px;bottom:7px;font-size:1.05rem;font-weight:600;color:var(--muted)}
.palace .earthstem.qi{color:var(--qi)}
.palace .pnum{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:2.4rem;color:rgba(169,148,224,.08);font-weight:900;line-height:1;pointer-events:none}
.palace .horse{position:absolute;left:8px;top:8px;font-size:.6rem;color:#fff;background:var(--zhu);border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.palace:has(.horse) .god{padding-left:20px}
.palace.kong{background:repeating-linear-gradient(135deg,transparent 0 12px,rgba(224,122,98,.06) 12px 13px),var(--bg-3)}
.palace.kong::after{content:"旬空";position:absolute;right:9px;top:26px;font-size:.58rem;color:var(--zhu);letter-spacing:.08em;border:1px solid rgba(224,122,98,.5);padding:0 3px;border-radius:2px;background:var(--bg-3)}
.palace.kong:not(.zhifu):not(.zhishi)::after{top:7px}
.palace.zhifu{border-color:var(--zhu);box-shadow:0 0 16px -6px rgba(224,122,98,.6)}
.palace.zhifu .stamp-fu{position:absolute;right:8px;top:7px;font-size:.62rem;color:#fff;background:var(--zhu);border-radius:2px;padding:1px 4px;font-weight:600}
.palace.zhishi{border-color:var(--qing);box-shadow:0 0 16px -6px rgba(143,176,216,.55)}
.palace.zhishi .stamp-shi{position:absolute;right:8px;top:7px;font-size:.62rem;color:var(--bg);background:var(--qing);border-radius:2px;padding:1px 4px;font-weight:600}
.palace.zhifu.zhishi .stamp-shi{right:32px}
.palace.yongshen{outline:1.5px dashed var(--zi-2);outline-offset:-5px}
.palace.yongshen::before{content:"用";position:absolute;left:50%;transform:translateX(-50%);top:4px;font-size:.6rem;color:var(--zi-2);border:1px solid var(--zi-2);padding:0 4px;border-radius:2px;background:var(--bg-3);z-index:2}
.palace.center{justify-content:center;align-items:center;background:none;border-style:dashed}
.palace.center .earthstem{position:static;font-size:1.4rem;color:var(--fg)}
.palace.center .earthstem::before,.palace.center .earthstem::after{content:"";display:block;width:14px;height:1px;background:var(--zi-2);margin:6px auto;opacity:.5}
.palace.center small{font-size:.62rem;color:var(--faint);letter-spacing:.15em;writing-mode:vertical-rl;position:absolute;right:8px;top:10px}

/* ---------- 分区 ---------- */
.qm-sec{display:none;animation:fbIn .3s}
.qm-sec.on{display:block}
.field{margin-top:14px}
.field label{display:block;font-family:var(--font-title);font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.2em}
.field input,.field textarea{width:100%}
textarea{min-height:68px;resize:vertical;line-height:1.7}
.chips,.wx{display:flex;gap:6px;flex-wrap:wrap}
.chip,.wx button{border:1px solid var(--rule-2);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted);background:var(--bg-3);font-family:var(--font-title);letter-spacing:.08em}
.chip:hover,.wx button:hover{color:var(--fg)}
.chip.on,.wx button.on{border-color:var(--zi-2);color:var(--fg);background:rgba(122,91,192,.25)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.savebtn{margin-top:18px}
.hint{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.7}

/* ---------- 卡片 ---------- */
.card{background:var(--bg-2);border:1px solid var(--rule);border-radius:var(--r-lg);padding:14px 16px;margin-top:12px}
.card .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;letter-spacing:.05em}
.card .pred{margin-top:8px;font-size:15px;line-height:1.75;white-space:pre-wrap;color:var(--fg-2)}
.card .pansum{margin-top:4px;font-size:12px;color:var(--zi-2);font-family:var(--font-title)}
.card .chart{margin-top:10px}
.attr{display:flex;gap:6px;flex-wrap:wrap}
.attr button{border:1px solid var(--rule-2);border-radius:var(--r-sm);padding:7px 13px;font-size:14px;background:var(--bg-3);font-family:var(--font-title);letter-spacing:.05em;color:var(--zhu)}
.attr button[data-a="验中"]{color:var(--lv)}
.attr button.on{background:currentColor}
.attr button.on{color:var(--bg)!important}
.attr button[data-a="验中"].on{background:var(--lv);border-color:var(--lv)}
.attr button:not([data-a="验中"]).on{background:var(--zhu);border-color:var(--zhu)}
.rowbtns{display:flex;gap:8px;margin-top:12px}
.rowbtns .primary{flex:1}
.empty{text-align:center;color:var(--faint);padding:44px 0;font-family:var(--font-title);font-size:13px;letter-spacing:.25em;line-height:2.2}

/* ---------- 统计 ---------- */
.stats{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:var(--bg-2);border:1px solid var(--rule);border-radius:var(--r);padding:10px;text-align:center}
.stat b{display:block;font-family:var(--font-title);font-size:1.3rem;font-weight:600}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.1em}
.filterrow{margin-top:12px}

@media (max-width:860px){
  .qm-layout{grid-template-columns:1fr;gap:14px}
  .qm-chart-card{position:static;padding:8px}
  .chart{gap:4px}
  .palace{padding:6px 7px}
  .palace .starline{font-size:.95rem}
  .palace .door{font-size:.9rem}
}
</style>
</head>
<body data-tool="qimen">

<main class="fb-main">
  <div class="fb-head">
    <div class="fb-seal">奇</div>
    <div>
      <h1 class="fb-title">奇门手记 <span class="en">QI MEN NOTES</span></h1>
      <div class="fb-sub">起局 · 封盘存断 · 次日复盘归档</div>
    </div>
  </div>

  <!-- 此刻：起局 -->
  <section class="fb-now">
    <div class="fb-now-info">
      <div class="fb-when"><span class="fb-tag" id="juTag">时家转盘</span><span id="juTerm"></span></div>
      <div class="fb-pillars" id="pillars"></div>
      <div class="fb-key" id="juMain"></div>
      <div class="fb-note qm-sub" id="juSub"></div>
      <div class="fb-note bad" id="boundaryWarn" hidden>距交气不足一小时，局数可能有出入，建议核对</div>
    </div>
    <div class="fb-now-ctrl">
      <div class="fb-row">
        <input type="datetime-local" id="dtInput" class="grow" aria-label="起局时间">
        <button type="button" class="fb-btn" id="nowBtn">此刻</button>
      </div>
      <div class="fb-row">
        <button type="button" class="fb-btn grow" id="ovToggle">改局</button>
      </div>
      <div class="override" id="overrideRow">
        <select id="ovDun" aria-label="阴阳遁"><option value="yang">阳遁</option><option value="yin">阴遁</option></select>
        <select id="ovJu" aria-label="局数"></select>
        <button type="button" class="fb-btn ghost" id="ovClear">恢复自动</button>
      </div>
      <div class="fb-fine">按节气与符头自动定局（拆补法）</div>
    </div>
  </section>

  <div class="qm-layout">
    <div class="fb-card qm-chart-card">
      <div class="chart" id="chart"></div>
      <div class="qm-key">
        <span><i style="background:var(--zhu);color:#fff">符</i>值符</span>
        <span><i style="background:var(--qing);color:var(--bg)">使</i>值使</span>
        <span><i style="border:1px solid var(--zi-2);color:var(--zi-2)">用</i>用神</span>
        <span><i style="background:var(--zhu);color:#fff;border-radius:50%">马</i>驿马</span>
        <span><i style="color:var(--qi)">乙丙丁</i>三奇</span>
      </div>
    </div>

    <div class="qm-side">
      <div class="fb-seg" id="secSeg">
        <button type="button" data-s="new" class="on">起局</button>
        <button type="button" data-s="review">待复盘<span class="badge" id="revBadge" hidden></span></button>
        <button type="button" data-s="lib">判例库</button>
      </div>

      <!-- 起局 -->
      <section id="sec-new" class="qm-sec on">
        <div class="field"><label>题型</label>
          <div class="chips" id="typeChips">
            <button class="chip on" data-t="天气">天气</button>
            <button class="chip" data-t="自由">自由</button>
          </div>
        </div>

        <div id="wxForm">
          <div class="field"><label>明日天气 · 预断</label>
            <div class="wx" id="wxPredict">
              <button data-v="晴">晴</button><button data-v="多云">多云</button><button data-v="阴">阴</button>
              <button data-v="雨">雨</button><button data-v="雪">雪</button>
            </div>
          </div>
          <div class="field"><label>风</label>
            <div class="wx" id="wxWind">
              <button data-v="无风/微风">无风·微风</button><button data-v="有风">有风</button><button data-v="大风">大风</button>
            </div>
          </div>
          <div class="field"><label>盘面依据（用神落宫·旺衰·一句话）</label>
            <textarea id="wxBasis" placeholder="例：天蓬加壬落坎得地，天英落坎受制——雨方胜"></textarea>
          </div>
        </div>

        <div id="freeForm" hidden>
          <div class="field"><label>所问何事</label><input id="fQ" placeholder="例：下周三考试结果"></div>
          <div class="grid2">
            <div class="field"><label>用神（谁/何宫）</label><input id="fYs" placeholder="例：日干＋景门"></div>
            <div class="field"><label>应期</label><input id="fTime" placeholder="例：三日内 / 申日"></div>
          </div>
          <div class="field"><label>预断（主体·事件·程度，写到可证伪）</label><textarea id="fPred"></textarea></div>
        </div>

        <button class="fb-btn primary block savebtn" id="saveBtn">封 盘 存 断</button>
        <p class="hint">断语一经保存不可修改（预注册原则）。明日打开本页，待复盘队列会自动浮出。</p>
      </section>

      <!-- 待复盘 -->
      <section id="sec-review" class="qm-sec">
        <div id="reviewList"></div>
      </section>

      <!-- 判例库 -->
      <section id="sec-lib" class="qm-sec">
        <div class="stats" id="statsRow"></div>
        <div class="filterrow chips" id="libFilter">
          <button class="chip on" data-f="全部">全部</button>
          <button class="chip" data-f="验中">验中</button>
          <button class="chip" data-f="用神错">用神错</button>
          <button class="chip" data-f="象意错">象意错</button>
          <button class="chip" data-f="应期错">应期错</button>
        </div>
        <div id="libList"></div>
        <div class="rowbtns"><button class="fb-btn primary" id="exportAll">导出全部判例 (Markdown)</button></div>
      </section>
    </div>
  </div>
</main>

 '秋分':[7,1,4],'寒露':[6,9,3],'霜降':[5,8,2],'立冬':[6,9,3],'小雪':[5,8,2],'大雪':[4,7,1]};
const YANG_TERMS = new Set(['冬至','小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种']);
const JIE = new Set(['立春','惊蛰','清明','立夏','芒种','小暑','立秋','白露','寒露','立冬','大雪','小寒']);
const MONTH_BRANCH_BY_JIE = {'立春':2,'惊蛰':3,'清明':4,'立夏':5,'芒种':6,'小暑':7,'立秋':8,'白露':9,'寒露':10,'立冬':11,'大雪':0,'小寒':1};
const HORSE = {2:'申',6:'申',10:'申', 8:'寅',0:'寅',4:'寅', 5:'亥',9:'亥',1:'亥', 11:'巳',3:'巳',7:'巳'};
const BRANCH_PALACE = {0:1, 1:8,2:8, 3:3, 4:4,5:4, 6:9, 7:2,8:2, 9:7, 10:6,11:6};

function jdn(y,m,d){ const a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045; }
const gzName = i => STEMS[i%10]+BRANCHES[i%12];

function computeChart(dt, TERMS, juOverride){
  const ms = dt.getTime();
  let term = TERMS[0], termIdx = 0;
  for(let i=0;i<TERMS.length;i++){ if(TERMS[i].t<=ms){ term=TERMS[i]; termIdx=i; } else break; }
  const nearBoundary = (termIdx+1<TERMS.length && TERMS[termIdx+1].t-ms < 3600e3) || (ms-term.t < 3600e3);
  let y=dt.getFullYear(), mo=dt.getMonth()+1, d=dt.getDate(), h=dt.getHours(), mi=dt.getMinutes();
  let J = jdn(y,mo,d); if(h>=23) J+=1;
  const dayIdx = ((J - 2415021 + 10) % 60 + 60) % 60;
  const hb = Math.floor(((h+1)%24)/2);
  const hs = ((dayIdx%10)%5*2 + hb) % 10;
  let hIdx = -1; for(let n=0;n<60;n++) if(n%10===hs && n%12===hb){ hIdx=n; break; }
  let lastJie = null;
  for(const t of TERMS){ if(t.t<=ms){ if(JIE.has(t.n)) lastJie=t; } else break; }
  let civilY = y;
  let liChunOfY = TERMS.find(t=>t.n==='立春' && new Date(t.t+9*3600e3).getUTCFullYear()===civilY);
  let yAdj = (liChunOfY && ms < liChunOfY.t) ? civilY-1 : civilY;
  const yearIdx = ((yAdj - 1984) % 60 + 60) % 60;
  let monthIdx = null;
  if(lastJie){
    const mb = MONTH_BRANCH_BY_JIE[lastJie.n];
    const monthOffsetFromYin = (mb - 2 + 12) % 12;
    const mstem = ((yearIdx%10)%5*2 + 2 + monthOffsetFromYin) % 10;
    for(let n=0;n<60;n++) if(n%10===mstem && n%12===mb){ monthIdx=n; break; }
  }
  const dstem = dayIdx%10;
  const back = dstem%5;
  const futou = ((dayIdx - back) % 60 + 60) % 60;
  const fb = futou % 12;
  const yuan = [0,6,3,9].includes(fb) ? 0 : [2,8,5,11].includes(fb) ? 1 : 2;
  const yang = YANG_TERMS.has(term.n);
  let ju = JU[term.n][yuan];
  if(juOverride){ ju = juOverride.ju; }
  const isYang = juOverride ? juOverride.yang : yang;
  const earth = {};
  for(let i=0;i<9;i++){
    const p = isYang ? ((ju-1+i)%9)+1 : (((ju-1-i)%9)+9)%9+1;
    earth[p] = EARTH_SEQ[i];
  }
  const palaceOfStem = s => { for(let p=1;p<=9;p++) if(earth[p]===s) return p; };
  const xun = hIdx - (hIdx%10);
  const dun = XUN_DUN[xun];
  const kong = XUN_KONG[xun];
  const p0raw = palaceOfStem(dun);
  const zhifuStar = STAR_HOME[p0raw];
  const zhishiDoor = p0raw===5 ? '死门' : DOOR_HOME[p0raw];
  const zhishiHomeRingP = p0raw===5 ? 2 : p0raw;
  const hourStem = STEMS[hs];
  const anchorStem = hs===0 ? dun : hourStem;
  let pt = palaceOfStem(anchorStem); if(pt===5) pt=2;
  const zhifuRingHome = p0raw===5 ? 2 : p0raw;
  const rpos = p => RING.indexOf(p);
  const rot = (rpos(pt) - rpos(zhifuRingHome) + 8) % 8;
  const sky = {};
  for(let i=0;i<8;i++){
    const homeP = RING[i];
    const destP = RING[(i+rot)%8];
    let star = STAR_HOME[homeP];
    let stems = [earth[homeP]];
    if(homeP===2){ star='天芮'; stems=[earth[2], earth[5]]; }
    sky[destP] = sky[destP]||{};
    sky[destP].star = star + (homeP===2 ? '·禽' : '');
    sky[destP].stems = stems;
  }
  const n = hIdx - xun;
  let destNum = isYang ? ((p0raw-1+n)%9)+1 : (((p0raw-1-n)%9)+9)%9+1;
  if(destNum===5) destNum=2;
  const doorRot = (rpos(destNum) - rpos(zhishiHomeRingP) + 8) % 8;
  const doors = {};
  for(let i=0;i<8;i++){
    const homeP = RING[i];
    doors[RING[(i+doorRot)%8]] = DOOR_HOME[homeP];
  }
  const gods = {};
  const zfP = RING[(rpos(zhifuRingHome)+rot)%8];
  for(let i=0;i<8;i++){
    const p = isYang ? RING[(rpos(zfP)+i)%8] : RING[(rpos(zfP)-i+8)%8];
    gods[p] = GODS[i];
  }
  const horseBranch = HORSE[hb];
  const horseP = BRANCH_PALACE[BRANCHES.indexOf(horseBranch)];
  const kongP = kong.map(k=>BRANCH_PALACE[BRANCHES.indexOf(k)]);
  return {
    pillars:{ year:gzName(yearIdx), month:monthIdx==null?'—':gzName(monthIdx), day:gzName(dayIdx), hour:gzName(hIdx) },
    term: term.n, termNext: TERMS[termIdx+1]||null, nearBoundary,
    dun: (isYang?'阳遁':'阴遁'), ju, yuan:['上元','中元','下元'][yuan], overridden: !!juOverride,
    xunShou: '甲'+BRANCHES[xun%12]+'旬（遁'+dun+'）', kong, kongP, horseBranch, horseP,
    zhifuStar, zhishiDoor, zfPalace: pt, zhishiPalace: destNum,
    earth, sky, doors, gods, palaceName: PALACE_NAME
  };
}
if(typeof module!=='undefined') module.exports = {computeChart, PALACE_NAME};

/* ================= state ================= */
const LS='qmsj.v1';
const load=()=>{try{return JSON.parse(localStorage.getItem(LS))||[]}catch(e){return[]}};
const save=es=>localStorage.setItem(LS,JSON.stringify(es));
let entries=load();
let curDate=new Date(); curDate.setSeconds(0,0);
let override=null;
let curType='天气';
const $=id=>document.getElementById(id);
const toast=Fabao.toast;
const fmt=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())};

/* ================= chart render ================= */
const GRID=[4,9,2,3,5,7,8,1,6];
const PNUM={1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',7:'七',8:'八',9:'九'};
const SANQI=new Set(['乙','丙','丁']);
const qiCls=s=>SANQI.has(s)?'stem qi':'stem';
const qiStem=s=>SANQI.has(s)?'qi':'';
function yongshenPalaces(c, type){
  if(type==='天气'){
    const out=[];
    for(let p=1;p<=9;p++){ if(p===5) continue;
      const st=c.sky[p]&&c.sky[p].star||''; if(st.includes('天蓬')||st.includes('天英')) out.push(p); }
    return out;
  }
  return [];
}
function renderChart(dt, ov, mountId, opts){
  const c=computeChart(dt,TERMS,ov);
  const el=mountId?$(mountId):$('chart');
  const ys=(opts&&opts.yongshen)||[];
  el.innerHTML=GRID.map(p=>{
    if(p===5) return `<div class="palace center"><small>中五·寄坤二</small><div class="earthstem">${c.earth[5]}</div><div class="pnum">五</div></div>`;
    const s=c.sky[p], kong=c.kongP.includes(p);
    const cls=['palace',kong?'kong':'',p===c.zfPalace?'zhifu':'',p===c.zhishiPalace?'zhishi':'',ys.includes(p)?'yongshen':''].filter(Boolean).join(' ');
    const stems=s.stems.map(x=>`<span class="${qiCls(x)}">${x}</span>`).join('');
    return `<div class="${cls}">
      <div><div class="god">${c.gods[p]}</div>
      <div class="starline">${s.star}${stems}</div></div>
      <div class="door">${c.doors[p]}</div>
      <div class="pnum">${PNUM[p]}</div>
      ${p===c.zfPalace?'<div class="stamp-fu">符</div>':''}
      ${p===c.zhishiPalace?'<div class="stamp-shi">使</div>':''}
      ${p===c.horseP?'<div class="horse">马</div>':''}
      <div class="earthstem ${qiStem(c.earth[p])}">${c.earth[p]}</div>
    </div>`;
  }).join('');
  return c;
}
function renderHeader(){
  const c=renderChart(curDate,override,null,{yongshen:[]});
  const ysReal=yongshenPalaces(c,curType);
  if(ysReal.length) renderChart(curDate,override,null,{yongshen:ysReal});
  $('pillars').innerHTML=[['年',c.pillars.year],['月',c.pillars.month],['日',c.pillars.day],['时',c.pillars.hour]]
    .map(([l,v])=>`<span class="fb-pillar"><small>${l}</small><b>${v}</b></span>`).join('');
  $('juMain').innerHTML=`<strong>${c.dun} ${c.ju} 局</strong><span class="sep">·</span>${c.yuan}`;
  $('juTerm').textContent=`${fmt(curDate)} · ${c.term}`;
  $('juTag').textContent=c.overridden?'手动局':'时家转盘';
  $('juSub').innerHTML=`<span>值符 <b>${c.zhifuStar}</b>⇢${c.zfPalace}</span><span class="sep">·</span>
    <span>值使 <b>${c.zhishiDoor}</b>⇢${c.zhishiPalace}</span><span class="sep">·</span>
    <span>空 <b>${c.kong.join('')}</b></span>`;
  $('ovToggle').textContent=c.overridden?'手动局 ✎':'改局';
  $('boundaryWarn').hidden=!c.nearBoundary;
  return c;
}

/* ================= override ================= */
(function(){
  const sel=$('ovJu'); for(let i=1;i<=9;i++){const o=document.createElement('option');o.value=i;o.textContent=i+'局';sel.appendChild(o)}
  $('ovDun').onchange=$('ovJu').onchange=()=>{override={ju:+$('ovJu').value,yang:$('ovDun').value==='yang'};renderHeader()};
  $('ovClear').onclick=()=>{override=null;$('overrideRow').classList.remove('on');renderHeader()};
})();
$('ovToggle').onclick=()=>$('overrideRow').classList.toggle('on');
Fabao.bindWhen($('dtInput'),$('nowBtn'),d=>{curDate=d;override=null;$('overrideRow').classList.remove('on');renderHeader()});

/* ================= new entry form ================= */
document.querySelectorAll('#typeChips .chip').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#typeChips .chip').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');curType=b.dataset.t;
  $('wxForm').hidden=curType!=='天气'; $('freeForm').hidden=curType!=='自由';
  renderHeader();
});
function pickGroup(id){ const g=$(id); g.querySelectorAll('button').forEach(b=>b.onclick=()=>{g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}); }
pickGroup('wxPredict'); pickGroup('wxWind');
const picked=id=>{const b=$(id).querySelector('.on');return b?b.dataset.v:null};

$('saveBtn').onclick=()=>{
  const c=computeChart(curDate,TERMS,override);
  let pred='',extra={};
  if(curType==='天气'){
    const w=picked('wxPredict');
    if(!w){toast('先选一个天气预断');return}
    const wind=picked('wxWind')||'未断风';
    pred=`明日：${w}，${wind}`+($('wxBasis').value.trim()?`\n依据：${$('wxBasis').value.trim()}`:'');
    extra={wxPred:w,windPred:wind};
  }else{
    if(!$('fPred').value.trim()){toast('预断不能为空');return}
    pred=`问：${$('fQ').value.trim()||'（未填）'}\n用神：${$('fYs').value.trim()||'（未填）'}\n应期：${$('fTime').value.trim()||'（未填）'}\n预断：${$('fPred').value.trim()}`;
  }
  entries.unshift({id:Date.now(), t:curDate.getTime(), type:curType, pred, ...extra,
    ov:override, pan:{dun:c.dun,ju:c.ju,yuan:c.yuan,term:c.term,zf:c.zhifuStar+'落'+c.zfPalace,zs:c.zhishiDoor+'落'+c.zhishiPalace,
      pillars:c.pillars, kong:c.kong.join('')},
    status:'open', attr:null, actual:null, note:''});
  save(entries);
  ['wxBasis','fQ','fYs','fTime','fPred'].forEach(i=>$(i).value='');
  document.querySelectorAll('#wxPredict .on,#wxWind .on').forEach(b=>b.classList.remove('on'));
  toast('已封盘。明日见分晓');
  refreshBadge();
};

/* ================= review ================= */
function dueEntries(){ const cut=Date.now()-12*3600e3; return entries.filter(e=>e.status==='open'); }
function refreshBadge(){
  const due=entries.filter(e=>e.status==='open'&&e.t<Date.now()-12*3600e3);
  const b=$('revBadge'); if(due.length){b.hidden=false;b.textContent=due.length}else b.hidden=true;
}
function renderReview(){
  const list=$('reviewList'); const open=dueEntries();
  if(!open.length){list.innerHTML='<div class="empty">无待复盘之局<br>去起一局吧</div>';return}
  list.innerHTML='';
  open.forEach(e=>{
    const card=document.createElement('div');card.className='card';
    const wxRow = e.type==='天气' ? `
      <div class="field"><label>实际天气</label><div class="wx" data-role="actualwx">
        ${['晴','多云','阴','雨','雪'].map(v=>`<button data-v="${v}">${v}</button>`).join('')}
      </div><div class="wx" data-role="actualwind">
        ${['无风/微风','有风','大风'].map(v=>`<button data-v="${v}">${v}</button>`).join('')}
      </div></div>`:'';
    card.innerHTML=`
      <div class="meta"><span>${fmt(new Date(e.t))} · ${e.type}</span><span>${e.pan.dun}${e.pan.ju}局 ${e.pan.term}</span></div>
      <div class="pansum">值符${e.pan.zf}宫 · 值使${e.pan.zs}宫 · 空${e.pan.kong}${e.ov?' · 手动局':''}</div>
      <div class="pred">${e.pred}</div>
      ${wxRow}
      <div class="field"><label>归因</label><div class="attr">
        ${['验中','用神错','象意错','应期错'].map(a=>`<button data-a="${a}">${a}</button>`).join('')}
      </div></div>
      <div class="field"><input data-role="note" placeholder="复盘一句话（可空）：错在哪 / 学到什么"></div>
      <div class="rowbtns">
        <button class="fb-btn primary" data-role="done">存入判例</button>
        <button class="fb-btn" data-role="showpan">看盘</button>
        <button class="fb-btn ghost" data-role="del">删</button>
      </div>
      <div class="chart" data-role="pan" style="display:none"></div>`;
    ['actualwx','actualwind'].forEach(r=>{const g=card.querySelector(`[data-role="${r}"]`);if(g)g.querySelectorAll('button').forEach(b=>b.onclick=()=>{g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')})});
    const ag=card.querySelector('.attr');ag.querySelectorAll('button').forEach(b=>b.onclick=()=>{ag.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
    card.querySelector('[data-role="showpan"]').onclick=ev=>{
      const pd=card.querySelector('[data-role="pan"]');
      if(pd.style.display==='none'){pd.style.display='grid';pd.id='pan'+e.id;renderChart(new Date(e.t),e.ov,'pan'+e.id);ev.target.textContent='收起'}
      else{pd.style.display='none';ev.target.textContent='看盘'}
    };
    card.querySelector('[data-role="del"]').onclick=()=>{if(confirm('删除这一局？')){entries=entries.filter(x=>x.id!==e.id);save(entries);renderReview();refreshBadge();renderLib()}};
    card.querySelector('[data-role="done"]').onclick=()=>{
      const a=ag.querySelector('.on'); if(!a){toast('先选归因');return}
      e.attr=a.dataset.a; e.status='done';
      e.note=card.querySelector('[data-role="note"]').value.trim();
      const awx=card.querySelector('[data-role="actualwx"] .on'), awd=card.querySelector('[data-role="actualwind"] .on');
      if(awx||awd) e.actual=[awx&&awx.dataset.v, awd&&awd.dataset.v].filter(Boolean).join('，');
      save(entries); toast('已入判例库'); renderReview(); refreshBadge(); renderLib();
    };
    list.appendChild(card);
  });
}

/* ================= library ================= */
let libF='全部';
document.querySelectorAll('#libFilter .chip').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#libFilter .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');libF=b.dataset.f;renderLib();
});
function mdOf(e){
  return `## 奇门判例 · ${e.type} · ${fmt(new Date(e.t))}

- **四柱**：${e.pan.pillars.year}年 ${e.pan.pillars.month}月 ${e.pan.pillars.day}日 ${e.pan.pillars.hour}时
- **局**：${e.pan.term} · ${e.pan.dun}${e.pan.ju}局（${e.pan.yuan}）${e.ov?' · 手动改局':''}
- **值符**：${e.pan.zf}宫｜**值使**：${e.pan.zs}宫｜**空亡**：${e.pan.kong}

### 预断（预注册）
${e.pred}

### 结果
${e.actual?('实际：'+e.actual+'\n'):''}**归因**：${e.attr||'—'}${e.note?('\n复盘：'+e.note):''}

#卜部/奇门判例 #${e.attr||'待复盘'}
`;
}
function renderLib(){
  const done=entries.filter(e=>e.status==='done');
  const n=done.length, hit=done.filter(e=>e.attr==='验中').length;
  const cnt=a=>done.filter(e=>e.attr===a).length;
  $('statsRow').innerHTML=`
    <div class="stat"><b>${n}</b><span>已复盘</span></div>
    <div class="stat"><b>${n?Math.round(hit/n*100)+'%':'—'}</b><span>验中率</span></div>
    <div class="stat"><b>${cnt('用神错')}/${cnt('象意错')}/${cnt('应期错')}</b><span>用神/象意/应期</span></div>`;
  const list=$('libList');
  const rows=done.filter(e=>libF==='全部'||e.attr===libF);
  if(!rows.length){list.innerHTML='<div class="empty">尚无判例</div>';return}
  list.innerHTML='';
  rows.forEach(e=>{
    const card=document.createElement('div');card.className='card';
    card.innerHTML=`
      <div class="meta"><span>${fmt(new Date(e.t))} · ${e.type}</span><span style="color:${e.attr==='验中'?'var(--ok)':'var(--zhu)'}">${e.attr}</span></div>
      <div class="pansum">${e.pan.dun}${e.pan.ju}局 · 值符${e.pan.zf} · 值使${e.pan.zs}</div>
      <div class="pred">${e.pred}${e.actual?'\n—— 实际：'+e.actual:''}${e.note?'\n—— '+e.note:''}</div>
      <div class="rowbtns"><button class="fb-btn" data-role="copy">复制判例 MD</button></div>`;
    card.querySelector('[data-role="copy"]').onclick=()=>{Fabao.copy(mdOf(e),'已复制，可贴入 07卜部')};
    list.appendChild(card);
  });
}
$('exportAll').onclick=()=>{
  const done=entries.filter(e=>e.status==='done');
  if(!done.length){toast('还没有可导出的判例');return}
  Fabao.copy(done.map(mdOf).join('\n---\n\n'),'全部判例已复制');
};

/* ================= tabs ================= */
document.querySelectorAll('#secSeg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#secSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  document.querySelectorAll('.qm-sec').forEach(s=>s.classList.remove('on'));
  $('sec-'+b.dataset.s).classList.add('on');
  if(b.dataset.s==='review')renderReview(); if(b.dataset.s==='lib')renderLib();
});

/* ================= boot ================= */
renderHeader(); refreshBadge(); renderLib();
if(entries.some(e=>e.status==='open'&&e.t<Date.now()-12*3600e3)){
  document.querySelector('#secSeg button[data-s="review"]').click();
}
