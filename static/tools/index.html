<head>

  <meta property="og:title" content="法宝库 · 潜蛟阁" />
  <meta property="og:description" content="阁主自制的术数工具，按山医命卜相分门，打开即用。" />

  <link rel="stylesheet" href="/fonts/qj.css?v=1c10c9e8">
  <link rel="stylesheet" href="/fonts/qj-rest.css?v=1c10c9e8" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/fabao/fabao.css?v=9">
  <style>
    /* 法宝库大堂：一屏小牌，按五门分行；牌子由 /fabao/fabao.js 的 TOOLS 现排（与顶栏同一份名单） */
    .ku-now { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 4px; color: var(--muted); font-size: 14px; letter-spacing: .12em; margin: -8px 0 24px; }
    .ku-now span { color: var(--faint); margin-right: 6px; }
    .ku-now b { font-family: var(--font-title); font-weight: 600; color: var(--fg); font-size: 16px; }
    .ku-again { margin-left: auto; color: var(--jin); text-decoration: none; font-family: var(--font-title); letter-spacing: .15em; padding: 6px 14px; border: 1px solid rgba(217,174,78,.4); border-radius: var(--r-sm); }
    .ku-again:hover { background: rgba(217,174,78,.1); }

    /* 我想问：一排问句，点了直达（名单在 data/wenti.yaml） */
    .ku-ask { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -8px 0 24px; }
    .ku-ask-h { font-family: var(--font-title); font-size: 13px; color: var(--faint); letter-spacing: .2em; margin-right: 4px; }
    .ku-ask a { font-size: 14px; color: var(--fg-2); text-decoration: none; padding: 4px 12px; border: 1px solid var(--rule-2); border-radius: var(--r-sm); background: var(--bg-2); white-space: nowrap; transition: border-color .2s, color .2s; }
    .ku-ask a:hover { color: var(--fg); border-color: var(--zi-2); }
    .ku-ask-more { font-size: 13px; color: var(--zi-2); padding: 4px 8px; font-family: var(--font-title); letter-spacing: .1em; }
    .ku-ask-more:hover { color: var(--fg); }

    .ku-men { display: flex; flex-direction: column; gap: 14px; }
    .ku-row { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; }
    .ku-seal {
      width: 40px; height: 40px; margin-top: 8px; display: grid; place-items: center; text-decoration: none;
      font-family: var(--font-title); font-weight: 900; font-size: 19px; color: var(--zi-2);
      border: 1px solid var(--rule-2); border-radius: 6px; transition: color .2s, border-color .2s;
    }
    .ku-seal:hover { color: var(--fg); border-color: var(--zi-2); }
    .ku-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
    .ku-tile {
      display: grid; grid-template-columns: 34px 1fr; grid-template-rows: auto auto; column-gap: 12px; row-gap: 2px; align-items: center;
      padding: 12px 16px; text-decoration: none; color: var(--fg);
      background: var(--bg-2); border: 1px solid var(--rule); border-radius: var(--r-lg);
      transition: border-color .2s, transform .2s, background .2s;
    }
    .ku-tile:hover { border-color: var(--zi-2); background: var(--bg-3); transform: translateY(-1px); }
    .ku-ico { grid-row: 1 / 3; width: 34px; height: 34px; display: grid; place-items: center; color: var(--zi-2); background: var(--bg-3); border-radius: 8px; }
    .ku-ico svg { width: 20px; height: 20px; }
    .ku-t { font-family: var(--font-title); font-weight: 600; font-size: 16px; letter-spacing: .12em; display: inline-flex; align-items: center; gap: 8px; }
    .ku-t i { font-style: normal; font-weight: 400; font-size: 10px; line-height: 16px; padding: 0 5px; border-radius: 3px; background: rgba(224,122,98,.2); color: var(--zhu); letter-spacing: 0; }
    .ku-s { font-size: 13px; color: var(--muted); letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* 一家的牌子：整块点了进上回用的那件；下面一排各件浮在上面，可直接点 */
    .ku-tile.is-fam { position: relative; }
    .ku-hit { position: absolute; inset: 0; z-index: 0; border-radius: inherit; }
    .ku-hit:focus-visible { outline-offset: -2px; }
    .ku-sub { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 0 9px; white-space: normal; overflow: visible; margin-left: -3px; }
    .ku-sub a { color: var(--muted); text-decoration: none; padding: 1px 3px; border-radius: 4px; transition: color .2s, background .2s; }
    .ku-sub a:hover { color: var(--fg); background: var(--bg-3); }

    /* 本机存档：盘与人只在这台设备上，这里导出、导入、扫码带走 */
    .ku-bk { margin-top: 28px; padding: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--bg-2); border: 1px solid var(--rule); border-radius: var(--r-lg); }
    .ku-bk-h { font-family: var(--font-title); font-weight: 600; font-size: 15px; letter-spacing: .2em; }
    .ku-bk-s { color: var(--muted); font-size: 14px; letter-spacing: .05em; }
    .ku-bk-a { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; }
    .ku-bk-a .fb-btn { padding: 8px 14px; font-size: 14px; }
    .ku-bk .fb-fine { flex: 1 1 100%; }

    .ku-else { margin-top: 26px; font-size: 13px; color: var(--faint); letter-spacing: .1em; line-height: 2; }
    .ku-else a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--rule-2); }
    .ku-else a:hover { color: var(--fg); }

    @media (max-width: 560px) {
      .ku-row { grid-template-columns: 1fr; gap: 8px; }
      .ku-seal { display: inline-flex; align-items: baseline; width: auto; height: auto; margin: 0; border: 0; font-size: 15px; letter-spacing: .3em; justify-self: start; }
      .ku-seal::after { content: "门"; font-weight: 400; font-size: 13px; color: var(--faint); }
      .ku-tiles { grid-template-columns: 1fr 1fr; gap: 8px; }
      .ku-tile { grid-template-columns: 28px 1fr; column-gap: 8px; padding: 12px; row-gap: 4px; }
      .ku-ico { grid-row: 1; width: 28px; height: 28px; background: none; }
      .ku-ico svg { width: 18px; height: 18px; }
      .ku-t { font-size: 15px; letter-spacing: .06em; }
      .ku-s { grid-column: 1 / 3; font-size: 12px; }
      .ku-s { white-space: normal; }
      .ku-sub { gap: 0 6px; }
      .ku-sub a { padding: 3px 3px; }
      .ku-bk { padding: 14px; }
      .ku-bk-a { margin-left: 0; }
      .ku-again { margin-left: 0; }
      .ku-ask { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -16px; padding-right: 16px; }
      .ku-ask::-webkit-scrollbar { display: none; }
    }
  </style>
</head>
