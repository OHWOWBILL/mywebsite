  <link rel="stylesheet" href="/fabao/fabao.css?v=4">
  <style>
    /* 法宝库大堂：一屏小牌，按五门分行；牌子由 /fabao/fabao.js 的 TOOLS 现排（与顶栏同一份名单） */
    .ku-now { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 4px; color: var(--muted); font-size: 14px; letter-spacing: .12em; margin: -6px 0 22px; }
    .ku-now span { color: var(--faint); margin-right: 6px; }
    .ku-now b { font-family: var(--font-title); font-weight: 600; color: var(--fg); font-size: 16px; }
    .ku-again { margin-left: auto; color: var(--jin); text-decoration: none; font-family: var(--font-title); letter-spacing: .15em; padding: 6px 14px; border: 1px solid rgba(217,174,78,.4); border-radius: 999px; }
    .ku-again:hover { background: rgba(217,174,78,.1); }

    .ku-men { display: flex; flex-direction: column; gap: 14px; }
    .ku-row { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; }
    .ku-seal {
      width: 40px; height: 40px; margin-top: 8px; display: grid; place-items: center; text-decoration: none;
      font-family: var(--font-title); font-weight: 900; font-size: 19px; color: var(--zi-2);
      border: 1px solid var(--rule-2); border-radius: 6px; transition: color .2s, border-color .2s;
    }
    .ku-seal:hover { color: var(--fg); border-color: var(--zi-2); }
    .ku-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
    .ku-tile {
      display: grid; grid-template-columns: 34px 1fr; grid-template-rows: auto auto; column-gap: 12px; row-gap: 2px; align-items: center;
      padding: 13px 16px; text-decoration: none; color: var(--fg);
      background: var(--bg-2); border: 1px solid var(--rule); border-radius: var(--r-lg);
      transition: border-color .2s, transform .2s, background .2s;
    }
    .ku-tile:hover { border-color: var(--zi-2); background: var(--bg-3); transform: translateY(-1px); }
    .ku-ico { grid-row: 1 / 3; width: 34px; height: 34px; display: grid; place-items: center; color: var(--zi-2); background: var(--bg-3); border-radius: 8px; }
    .ku-ico svg { width: 20px; height: 20px; }
    .ku-t { font-family: var(--font-title); font-weight: 600; font-size: 16px; letter-spacing: .12em; display: inline-flex; align-items: center; gap: 8px; }
    .ku-t i { font-style: normal; font-weight: 400; font-size: 10px; line-height: 16px; padding: 0 5px; border-radius: 3px; background: rgba(224,122,98,.2); color: var(--zhu); letter-spacing: 0; }
    .ku-s { font-size: 12.5px; color: var(--muted); letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .ku-else { margin-top: 26px; font-size: 13px; color: var(--faint); letter-spacing: .1em; line-height: 2; }
    .ku-else a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--rule-2); }
    .ku-else a:hover { color: var(--fg); }

    @media (max-width: 560px) {
      .ku-row { grid-template-columns: 1fr; gap: 8px; }
      .ku-seal { display: inline-flex; align-items: baseline; width: auto; height: auto; margin: 0; border: 0; font-size: 15px; letter-spacing: .3em; justify-self: start; }
      .ku-seal::after { content: "门"; font-weight: 400; font-size: 13px; color: var(--faint); }
      .ku-tiles { grid-template-columns: 1fr 1fr; gap: 8px; }
      .ku-tile { grid-template-columns: 26px 1fr; column-gap: 8px; padding: 11px 12px; row-gap: 4px; }
      .ku-ico { grid-row: 1; width: 26px; height: 26px; background: none; }
      .ku-ico svg { width: 18px; height: 18px; }
      .ku-t { font-size: 15px; letter-spacing: .06em; }
      .ku-s { grid-column: 1 / 3; font-size: 12px; }
      .ku-s { white-space: normal; }
      .ku-again { margin-left: 0; }
    }
  </style>
</head>
<body data-tool="ku">

<main class="fb-main">

  </p>
</main>

</html>
