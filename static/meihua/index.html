<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#17131F" />
  <title>梅花 · 潜蛟阁法宝库</title>
  <meta name="description" content="梅花易数起卦排盘：时间、报数、随机起卦，本互变三卦逐爻查辞，体用生克一眼可见。" />
  <link rel="icon" href="/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=LXGW+WenKai+TC&family=Archivo:wdth,wght@125,500;125,800&display=swap">
  <link rel="stylesheet" href="/fabao/fabao.css?v=6">
  <link rel="stylesheet" href="styles/main.css?v=4">
</head>
<body data-tool="meihua">

<main class="fb-main">
  <div class="fb-head">
    <div class="fb-seal">梅</div>
    <div>
      <h1 class="fb-title">梅花 <span class="en">MEI HUA YI SHU</span></h1>
      <div class="fb-sub">时间 · 报数 · 随机起卦，本互变三卦逐爻查辞</div>
    </div>
  </div>

  <!-- 此刻：起卦 -->
  <section class="fb-now" data-gloss>
    <div class="fb-now-info" id="qiguaInfo">
      <div class="fb-note">正在按此刻起卦…</div>
    </div>

    <div class="fb-now-ctrl">
      <div class="fb-seg" id="methodSeg" role="tablist">
        <button type="button" data-m="time" class="on">时间</button>
        <button type="button" data-m="num">报数</button>
        <button type="button" data-m="random">随机</button>
      </div>
      <div class="fb-row" data-for="time num">
        <input type="datetime-local" id="dtInput" class="grow" aria-label="起卦时间">
        <button type="button" class="fb-btn" id="nowBtn">此刻</button>
      </div>
      <div class="fb-row" data-for="num" hidden>
        <input type="number" id="numA" class="grow" inputmode="numeric" min="1" placeholder="上数" aria-label="上卦数">
        <input type="number" id="numB" class="grow" inputmode="numeric" min="1" placeholder="下数" aria-label="下卦数">
      </div>
      <div class="fb-row">
        <button type="button" class="fb-btn primary grow" id="castBtn">起 卦</button>
        <button type="button" class="fb-btn" id="copyBtn" title="复制为 Markdown 卦例">复制</button>
        <button type="button" class="fb-btn" id="aiBtn" title="把卦连同本站口径包成一段提示词复制，贴给任意 AI">问 AI</button>
        <button type="button" class="fb-btn" id="shareBtn" title="把这一卦画成一张图，可存可分享">分享图</button>
        <button type="button" class="fb-btn ghost" id="clearBtn">清空</button>
      </div>
    </div>
  </section>

  <div class="dashboard">
    <article class="gua-card ben" data-card="ben">
      <div class="card-head">
        <div class="card-label-row">
          <div class="card-label">本卦 <span class="en">ORIGINAL</span></div>
          <div class="matched-name"></div>
        </div>
        <div class="tri-pickers"></div>
        <div class="yao-viz"></div>
      </div>
      <div class="card-body"></div>
    </article>

    <article class="gua-card hu" data-card="hu">
      <div class="card-head">
        <div class="card-label-row">
          <div class="card-label">互卦 <span class="en">NUCLEAR</span></div>
          <div class="matched-name"></div>
        </div>
        <div class="tri-pickers"></div>
        <div class="yao-viz"></div>
      </div>
      <div class="card-body"></div>
    </article>

    <article class="gua-card bian" data-card="bian">
      <div class="card-head">
        <div class="card-label-row">
          <div class="card-label">变卦 <span class="en">CHANGED</span></div>
          <div class="matched-name"></div>
        </div>
        <div class="tri-pickers"></div>
        <div class="yao-viz"></div>
      </div>
      <div class="card-body"></div>
    </article>
  </div>

  <p class="fb-foot">动爻所在为用，另一经卦为体 · 点爻线看爻辞 · 上下卦可手动改</p>
</main>

<script src="/fabao/fabao.js?v=13"></script>
<script src="data/hexagrams.js?v=3"></script>
<script src="data/yao.js?v=3"></script>
<script src="/fabao/lunar.js?v=1"></script>
<script src="js/app.js?v=7"></script>
<script>
// 问 AI：借「复制」的卦例文字（app.js 的 caseMarkdown），再补卦辞与动爻爻辞，连同本页口径一并复制
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const RULES = [
    '先天八卦数：乾一、兑二、离三、震四、巽五、坎六、艮七、坤八；除八取余定卦（余零作八），除六取余定动爻（余零作六）。',
    '时间起卦：农历年支数（子一……亥十二）+ 月 + 日为上卦，再加时支数为下卦，总数定动爻；23 点起为子时，算作次日；农历为寿星万年历口径。',
    '报数起卦：上数定上卦，下数定下卦，两数之和加时支数定动爻。',
    '动爻所在的经卦为用，另一经卦为体；互卦取本卦二至四、三至五爻；变卦为动爻阴阳互变。',
    '体用生克：比和吉，用生体大吉，体克用吉而费力，体生用耗泄，用克体不利。'
  ].join('\n');
  // 某张卦卡上配出的卦名（未配齐为空）
  const nameOf = type => { const el = document.querySelector(`[data-card="${type}"] .matched-name`); return el && el.classList.contains('ok') ? el.textContent.replace('✓', '').trim() : ''; };
  // 卦例文字取 app.js 的 caseMarkdown；万一没挂出来，就临时接住 Fabao.copy、点一下「复制」取到，再原样放回
  function caseText() {
    if (typeof window.MeihuaCase === 'function') return window.MeihuaCase();
    let got = null;
    const orig = Fabao.copy;
    Fabao.copy = t => { got = t; };
    try { $('copyBtn').click(); } finally { Fabao.copy = orig; }
    return got;
  }
  $('aiBtn').addEventListener('click', () => {
    const ben = nameOf('ben');
    if (!ben) { Fabao.toast('先起一卦，或选齐上下卦'); return; }
    const t = caseText();
    // 卦例末尾的「所问 / 断」空栏与标签是记笔记用的，问 AI 时换成所问一行
    const L = [t ? t.replace(/\n+### 所问[\s\S]*$/, '') : `## 梅花卦例\n\n${$('qiguaInfo').innerText.trim()}\n- 本 ${ben} · 互 ${nameOf('hu') || '—'} · 变 ${nameOf('bian') || '—'}`];
    const T = window.YAO_TEXT && window.YAO_TEXT[ben], dong = document.querySelector('[data-card="ben"] .yao-row.dong');
    if (T) L.push(`- **${ben}卦辞**：${T.gua}`);
    const y = T && dong && T.yao[+dong.dataset.idx];
    if (y) L.push(`- **动爻爻辞**：${y[0]} ${y[1]}`);
    L.push('- **所问**：（未写；贴给 AI 时在这里补上所问之事）');
    Fabao.askAI('梅花易数', L.join('\n'), RULES);
  });
  // 分享图：本之变为题，体用一句作金句，卦辞、动爻爻辞、互卦随后
  $('shareBtn').addEventListener('click', () => {
    const ben = nameOf('ben');
    if (!ben) { Fabao.toast('先起一卦，或选齐上下卦'); return; }
    const bian = nameOf('bian'), hu = nameOf('hu');
    const T = window.YAO_TEXT && window.YAO_TEXT[ben], dong = document.querySelector('[data-card="ben"] .yao-row.dong');
    const y = T && dong && T.yao[+dong.dataset.idx];
    const note = document.querySelector('#qiguaInfo .fb-note'), when = document.querySelector('#qiguaInfo .fb-when');
    Fabao.share({
      title: bian && bian !== ben ? `${ben} 之 ${bian}` : ben,
      key: note ? note.innerText.trim() : '',
      lines: [T && T.gua ? ['卦辞', T.gua] : null, y ? ['动爻', `${y[0]}　${y[1]}`] : null, hu ? ['互卦', hu] : null].filter(Boolean),
      meta: when ? when.innerText.replace(/\s+/g, ' ').trim() : ''
    });
  });
})();
</script>
</body>
</html>
