<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="/fonts/qj-rest.css?v=5eeb78f3" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/fabao/fabao.css?v=10">
  <style>
    :root {
      --h-lu: #8DBF97; --h-quan: #C79BEA; --h-ke: #8FB0D8; --h-ji: #E07A62;
    }
    .h-禄 { --hc: var(--h-lu); } .h-权 { --hc: var(--h-quan); } .h-科 { --hc: var(--h-ke); } .h-忌 { --hc: var(--h-ji); }

    /* —— 起盘面板 —— */
    .zw-form { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .zw-form .fb-row { gap: 8px 10px; }
    .zw-form input[type=text] { width: 9em; }
    .zw-form input[type=number] { width: 5.6em; }
    .zw-lunar select { padding-right: 4px; }
    .zw-chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); letter-spacing: .08em; cursor: pointer; white-space: nowrap; }
    .zw-chk input { accent-color: var(--zi); }
    .zw-sun { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .zw-sun[aria-disabled=true] > :not(.zw-chk):not(#tzIn):not(.fb-fine):not(.qj-cq):not(#cityIn) { opacity: .4; pointer-events: none; }
    .zw-dst { font-size: 12.5px; color: var(--jin); line-height: 1.7; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
    .zw-dst .fb-btn { padding: 3px 10px; font-size: 12px; letter-spacing: .08em; }
    .zw-side-ctrl { display: flex; flex-direction: column; gap: 8px; }
    .zw-side-ctrl .fb-row .fb-btn { flex: 1; }
    .zw-lib { width: 100%; }

    /* —— 主体 —— */
    .zw-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
    .zw-board {
      position: relative;
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(158px, auto));
      background: var(--rule); gap: 1px; border: 1px solid var(--rule); border-radius: var(--r-lg); overflow: hidden;
    }
    .zw-cell {
      position: relative; background: var(--bg-2); padding: 6px 7px 5px; min-width: 0;
      display: flex; flex-direction: column; cursor: pointer; transition: background .2s;
    }
    .zw-cell:hover { background: #211a2c; }
    .zw-cell.sf { background: color-mix(in oklab, var(--zi) 9%, var(--bg-2)); }
    .zw-cell.sel { background: color-mix(in oklab, var(--zi) 20%, var(--bg-2)); box-shadow: inset 0 0 0 1px var(--zi-2); }
    .zw-cell.to { box-shadow: inset 0 0 0 1px var(--hc, var(--zi-2)); }

    /* 星曜：一星一竖列 */
    .zw-stars { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px 3px; flex: 1; min-height: 0; }
    .zw-s { display: flex; flex-direction: column; align-items: center; line-height: 1.12; }
    .zw-s .n { display: flex; flex-direction: column; align-items: center; font-family: var(--font-title); line-height: 1.08; }
    .zw-s.major .n { font-size: 15px; font-weight: 600; color: #F0D9A8; }
    .zw-s.minor .n { font-size: 13px; color: var(--fg-2); }
    .zw-s.minor.tough .n { color: #C9A0A0; }
    .zw-s.adj .n { font-size: 12px; color: var(--muted); }
    .zw-s.yun .n { font-size: 12px; color: var(--qing); }
    .zw-s .b { font-size: 12px; color: var(--faint); margin-top: 1px; font-family: var(--font-title); }
    .zw-s .b.庙, .zw-s .b.旺 { color: #B9A86E; }
    .zw-s .b.陷, .zw-s .b.不 { color: #8A6A78; }
    .hua {
      display: block; font-style: normal; font-family: var(--font-title); font-size: 12px; line-height: 15px;
      width: 15px; text-align: center; border-radius: 3px; margin-top: 2px;
      background: var(--hc); color: #17131F; font-weight: 600;
    }
    .hua.dx, .hua.ln, .hua.ly { background: none; color: var(--hc); border: 1px solid var(--hc); line-height: 13px; }
    .hua.ln { border-style: dashed; }
    .hua.ly { border-style: dotted; }
    .hua.self { background: none; color: var(--hc); font-weight: 600; width: auto; padding: 0 1px; font-size: 12px; }
    .zw-adj-off .zw-s.adj { display: none; }

    /* 宫底 */
    .zw-foot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 4px; margin-top: 4px; font-size: 12px; color: var(--faint); line-height: 1.35; }
    .zw-foot .l { display: flex; flex-direction: column; }
    .zw-foot .l span:first-child { color: var(--muted); }
    .zw-foot .c { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .zw-foot .pn { font-family: var(--font-title); font-size: 14px; font-weight: 600; color: var(--zi-2); letter-spacing: .12em; white-space: nowrap; }
    .zw-cell.ming .pn { color: var(--fg); }
    .zw-foot .pn sup { font-size: 12px; color: var(--jin); font-weight: 400; margin-left: 1px; letter-spacing: 0; vertical-align: 3px; }
    .zw-foot .dx { font-family: var(--font-mark); font-size: 12px; color: var(--muted); }
    .zw-foot .r { justify-self: end; text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
    .zw-foot .gz { font-family: var(--font-title); font-size: 13px; color: var(--fg-2); display: flex; flex-direction: column; line-height: 1.1; }
    .zw-tags { display: flex; flex-wrap: wrap; gap: 2px 4px; justify-content: center; }
    .zw-tags b { font-weight: 400; font-family: var(--font-title); font-size: 12px; padding: 0 4px; border-radius: 3px; white-space: nowrap; }
    .zw-tags .t-zh { background: rgba(217, 174, 78, .16); color: var(--jin); }
    .zw-tags .t-dx { background: rgba(143, 176, 216, .14); color: var(--qing); }
    .zw-tags .t-ln { background: rgba(141, 191, 151, .14); color: var(--lv); }
    .zw-tags .t-ly { background: rgba(201, 165, 120, .14); color: var(--wx-tu); }

    /* 转宫点 */
    .zw-dot {
      position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; border-radius: 50%;
      display: grid; place-items: center; color: var(--faint); z-index: 3;
    }
    .zw-dot::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.3px solid currentColor; transition: background-color .16s, border-color .16s, transform .16s; }
    .zw-dot:hover { color: var(--jin); }
    .zw-dot.on { color: var(--jin); }
    .zw-dot.on::before { background: var(--jin); box-shadow: 0 0 0 3px rgba(217, 174, 78, .22); }

    /* 中宫 */
    .zw-center {
      grid-column: 2 / 4; grid-row: 2 / 4; background: var(--bg); padding: 16px 18px;
      display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; z-index: 1;
    }
    .zw-center h2 { font-family: var(--font-title); font-weight: 600; font-size: 17px; letter-spacing: .2em; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
    .zw-center h2 small { font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: .1em; }
    .zw-center .kv { font-size: 12.5px; color: var(--fg-2); line-height: 1.75; }
    .zw-center .kv b { font-family: var(--font-title); font-weight: 400; color: var(--faint); margin-right: 6px; letter-spacing: .1em; }
    .zw-center .key { font-family: var(--font-title); font-size: 16px; letter-spacing: .1em; }
    .zw-center .key .jin { color: var(--jin); font-weight: 600; }
    .zw-center .view { margin-top: auto; font-size: 12px; color: var(--muted); line-height: 1.7; }
    .zw-center .view b { color: var(--jin); font-weight: 600; font-family: var(--font-title); }
    .zw-legend { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 12px; color: var(--faint); }
    .zw-legend span { display: inline-flex; align-items: center; gap: 4px; }
    .zw-legend i { display: inline-block; width: 13px; height: 13px; border-radius: 3px; background: var(--hc); }
    .zw-legend i.o { background: none; box-shadow: inset 0 0 0 1px var(--muted); }

    /* 连线层 */
    .zw-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; overflow: visible; }
    .zw-lines .sf { stroke: var(--zi-2); stroke-width: 1.2; fill: none; opacity: .55; stroke-dasharray: 4 4; }
    .zw-lines .sf-opp { stroke: var(--zi-2); stroke-width: 1.2; opacity: .55; }
    .zw-lines .fly { fill: none; stroke: var(--hc); stroke-width: 1.8; opacity: .95; }
    .zw-lines .fly-lab rect { fill: var(--bg); stroke: var(--hc); stroke-width: 1; }
    .zw-lines .fly-lab text { fill: var(--hc); font-family: var(--font-title); font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
    .zw-lines .anchor { fill: var(--zi-2); }
    .zw-lines .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: zwDraw .55s ease-out forwards; }
    @keyframes zwDraw { to { stroke-dashoffset: 0; } }

    /* 运限条 */
    .zw-yun { margin-top: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .zw-yrow { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 8px; align-items: center; }
    .zw-yrow > small { font-family: var(--font-title); font-size: 12px; color: var(--muted); letter-spacing: .2em; }
    .zw-ybtns { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
    .zw-ybtns button {
      flex: 1 0 auto; min-width: 58px; padding: 5px 6px 4px; border-radius: var(--r-sm); background: var(--bg-3); border: 1px solid transparent;
      display: flex; flex-direction: column; align-items: center; line-height: 1.3; color: var(--fg-2);
    }
    .zw-ybtns button:hover { border-color: var(--rule-2); }
    .zw-ybtns button.on { border-color: var(--zi-2); background: color-mix(in oklab, var(--zi) 26%, var(--bg-3)); color: var(--fg); }
    .zw-ybtns b { font-family: var(--font-title); font-weight: 600; font-size: 13.5px; letter-spacing: .05em; }
    .zw-ybtns span { font-family: var(--font-mark); font-size: 12px; color: var(--faint); }
    .zw-ybtns button.on span { color: var(--muted); }
    .zw-ybtns button i { font-style: normal; font-size: 12px; color: var(--jin); font-family: var(--font-title); }

    /* 右栏 */
    .zw-side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: calc(var(--top-h) + 14px); }
    .dp-lock { max-width: 340px; margin: 14px auto 6px; text-align: center; display: grid; gap: 10px; justify-items: center; }
    .dp-lock .fb-seal { width: 52px; height: 52px; font-size: 30px; background: var(--zhu); transform: rotate(-8deg); }
    .dp-lock-t { font-family: var(--font-title); font-size: 17px; letter-spacing: .12em; }
    .dp-lock-t .jin { color: var(--jin); }
    .dp-lock input[type=password] { width: 100%; text-align: center; font-size: 16px; letter-spacing: .3em; padding: 10px 12px; }
    .dp-lock .fb-btn { width: 100%; }
    .dp-msg { min-height: 1.4em; font-size: 13px; color: var(--zhu); }
    .zw-card { padding: 16px 18px; }
    .zw-card h3 { font-family: var(--font-title); font-weight: 600; font-size: 15px; letter-spacing: .2em; margin-bottom: 10px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
    .zw-card h3 small { font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: .08em; }
    .zw-card h3 .zh { color: var(--jin); font-weight: 600; }
    .zw-dl { font-size: 13px; line-height: 1.8; color: var(--fg-2); }
    .zw-dl > div { display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 8px; padding: 3px 0; border-top: 1px dashed var(--rule); }
    .zw-dl > div:first-child { border-top: none; }
    .zw-dl dt { font-family: var(--font-title); color: var(--faint); letter-spacing: .1em; font-size: 12px; padding-top: 1px; }
    .zw-dl .star { font-family: var(--font-title); color: var(--fg); }
    .zw-dl .star.major { color: #F0D9A8; font-weight: 600; }
    .zw-dl .star em { font-style: normal; font-size: 12px; color: var(--faint); margin-left: 1px; }
    .zw-dl .chip { display: inline-block; font-size: 12px; font-family: var(--font-title); padding: 0 4px; margin-left: 2px; border-radius: 3px; background: var(--hc); color: #17131F; }
    .zw-dl .chip.o { background: none; color: var(--hc); box-shadow: inset 0 0 0 1px var(--hc); }
    .zw-flys { display: flex; flex-direction: column; gap: 4px; }
    .zw-fly { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; padding: 4px 8px; border-radius: var(--r-sm); background: var(--bg-3); cursor: pointer; border: 1px solid transparent; }
    .zw-fly:hover { border-color: var(--hc); }
    .zw-fly .k { width: 20px; height: 20px; border-radius: 4px; background: var(--hc); color: #17131F; font-family: var(--font-title); font-weight: 600; font-size: 12px; display: grid; place-items: center; }
    .zw-fly .s { font-family: var(--font-title); color: var(--fg); }
    .zw-fly .to { font-family: var(--font-title); color: var(--hc); white-space: nowrap; }
    .zw-fly .to small { font-size: 12px; color: var(--faint); margin-left: 3px; }
    .zw-src { margin-bottom: 10px; }
    .zw-src button { padding: 5px 10px; font-size: 12.5px; letter-spacing: .08em; }
    .zw-acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .zw-acts .fb-btn { padding: 6px 12px; font-size: 13px; letter-spacing: .1em; }
    .zw-opts { display: flex; flex-wrap: wrap; gap: 6px 14px; }


    /* 白话：盘上几句大白话，随盘重画（八字、占星同式） */
    .bh { margin-bottom: 14px; }

    @media (max-width: 1100px) {
      .zw-wrap { grid-template-columns: 1fr; }
      .zw-side { position: static; display: grid; grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 860px) {
      .zw-side { grid-template-columns: 1fr; }
      .zw-board { grid-template-rows: repeat(4, minmax(128px, auto)); margin: 0 -10px; border-radius: var(--r); }
      .zw-cell { padding: 4px 3px 3px; }
      .zw-stars { gap: 3px 1px; }
      .zw-s.major .n { font-size: 13px; }
      .zw-s.minor .n { font-size: 11.5px; }
      .zw-s.adj .n, .zw-s.yun .n { font-size: 11px; }
      .zw-s .b { font-size: 11px; }
      .hua { width: 13px; font-size: 11px; line-height: 13px; }
      .zw-foot { font-size: 11px; grid-template-columns: auto 1fr auto; gap: 2px; }
      .zw-foot .l span:last-child { display: none; }
      .zw-foot .pn { font-size: 12px; letter-spacing: .02em; }
      .zw-foot .gz { font-size: 11.5px; }
      .zw-foot .dx { font-size: 11px; }
      .zw-tags b { font-size: 11px; padding: 0 2px; }
      .zw-dot { top: 1px; right: 1px; }
      .zw-center { padding: 10px 10px; gap: 3px; }
      .zw-center h2 { font-size: 14px; letter-spacing: .1em; }
      .zw-center .kv { font-size: 11px; line-height: 1.6; }
      .zw-center .key { font-size: 13px; }
      .zw-center .view { font-size: 11px; }
      .zw-legend { display: none; }
      .zw-yrow { grid-template-columns: 1fr; gap: 4px; }
      .zw-ybtns button { min-width: 52px; }
      .zw-form input[type=text] { width: 100%; }
    }
  </style>
</head>
<body data-tool="ziwei">
<main class="fb-main">
  <header class="fb-head">
    <div class="fb-seal" aria-hidden="true">紫</div>
    <div>
      <h1 class="fb-title">紫微斗数</h1>
      <p class="fb-sub">十二宫安星 · 三方四正 · 宫干飞化 · 转宫 · 大限流年 · 两盘</p>
    </div>
  </header>

  <section class="fb-now" aria-label="起盘">
    <div class="zw-form">
      <div class="fb-row">
        <div class="fb-seg" id="calSeg" role="group" aria-label="历法"><button data-v="solar" class="on">公历</button><button data-v="lunar">农历</button></div>
        <div class="fb-seg" id="genSeg" role="group" aria-label="性别"><button data-v="男" class="on">男</button><button data-v="女">女</button></div>
        <input type="text" id="nameIn" placeholder="姓名或备注" maxlength="24" aria-label="姓名或备注">
      </div>
      <div class="fb-row" id="solarRow">
        <input type="datetime-local" id="whenIn" aria-label="出生时间（公历）">
        <button class="fb-btn" id="nowBtn" type="button">此刻</button>
        <span class="fb-note" id="shiNote"></span>
      </div>
      <div class="fb-row zw-lunar" id="lunarRow" hidden>
        <input type="number" id="lyIn" min="1900" max="2100" aria-label="农历年">
        <select id="lmIn" aria-label="农历月"></select>
        <label class="zw-chk"><input type="checkbox" id="leapIn">闰月</label>
        <select id="ldIn" aria-label="农历日"></select>
        <select id="ltIn" aria-label="时辰"></select>
      </div>
      <div class="zw-sun" id="sunRow">
        <label class="zw-chk"><input type="checkbox" id="sunIn">真太阳时</label>
        <select id="cityIn" aria-label="出生城市"></select>
        <input type="number" id="lonIn" step="0.01" min="-180" max="180" inputmode="decimal" aria-label="东经">
        <select id="tzIn" aria-label="出生地时区" title="出生地时区：真太阳时与交节换月都按它算"></select>
        <span class="fb-fine" id="sunNote"></span>
      </div>
      <div class="zw-dst" id="dstNote" hidden></div>
    </div>
    <div class="fb-now-ctrl zw-side-ctrl">
      <div class="fb-row">
        <button class="fb-btn primary" id="castBtn" type="button">排盘</button>
        <button class="fb-btn" id="saveBtn" type="button">存盘</button>
        <button class="fb-btn" id="copyBtn" type="button">复制</button>
        <button class="fb-btn" id="aiBtn" type="button" title="把命盘连同本站口径包成一段提示词复制，贴给任意 AI">问 AI</button>
        <button class="fb-btn" id="shareBtn" type="button" title="把命盘大概画成一张图，可存可分享">分享图</button>
      </div>
      <select id="libSel" class="zw-lib" aria-label="盘库"><option value="">盘库（存过的盘）</option></select>
      <div class="zw-opts">
        <label class="zw-chk"><input type="checkbox" id="adjIn" checked>杂曜</label>
        <label class="zw-chk"><input type="checkbox" id="sfIn" checked>三方四正线</label>
        <label class="zw-chk"><input type="checkbox" id="flyIn" checked>飞化箭头</label>
        <label class="zw-chk" title="本盘与另一个时辰并排比，出生时辰拿不准时用"><input type="checkbox" id="twoIn">两盘</label>
      </div>
    </div>
  </section>

  <div class="zw-wrap">
    <div>
      <section class="fb-card bh" id="bhCard" aria-label="白话" hidden></section>
      <div class="zw-board" id="board" aria-label="命盘"></div>
      <section class="fb-card zw-yun" aria-label="运限">
        <div class="zw-yrow"><small>大限</small><div class="zw-ybtns" id="dxRow"></div></div>
        <div class="zw-yrow"><small>流年</small><div class="zw-ybtns" id="lnRow"></div></div>
        <div class="zw-yrow"><small>流月</small><div class="zw-ybtns" id="lyRow"></div></div>
      </section>
      <section class="fb-card zw-card" id="twoCard" aria-label="两盘参看" hidden style="margin-top:14px">
        <h3>两盘参看<small>亮的是两盘不同处</small></h3>
        <div id="twoBody"></div>
      </section>
    </div>
    <aside class="zw-side">
      <section class="fb-card zw-card" id="detail" aria-live="polite"></section>
      <section class="fb-card zw-card" id="flyCard"></section>
    </aside>
  </div>

  <p class="fb-foot">潜蛟阁 · 法宝库 · 仅供学习参考</p>
</main>

<script src="/ziwei/iztro.min.js?v=2.6.3"></script>
<script src="/qimen/jieqi.js?v=1"></script>
<script src="/ziwei/ziwei.js?v=2"></script>
<script src="/fabao/cities.js?v=2"></script>
<script src="/fabao/jiaoshi.js?v=2"></script>
<script src="/fabao/fabao.js?v=19"></script>
<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const { toast, copy, toLocalInput } = window.Fabao;
const Z = window.ZW;
const ZHI = Z.ZHI, SHORT = Z.SHORT;
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 盘格：地支 → [行, 列]（1 起）
const POS = { 5: [1, 1], 6: [1, 2], 7: [1, 3], 8: [1, 4], 4: [2, 1], 9: [2, 4], 3: [3, 1], 10: [3, 4], 2: [4, 1], 1: [4, 2], 0: [4, 3], 11: [4, 4] };
// 出生地：共用 /fabao/cities.js（[名, 东经, 北纬, 时区, IANA]），与八字、占星同一张
const QC = window.QJ_CITIES, GUESS = QC.guess();
const LS_LIB = 'zwds.lib.v1', LS_VIEW = 'zwds.view.v1';
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 无痕模式 */ } }
};

let view = Object.assign({ adj: !window.matchMedia('(max-width: 860px)').matches, sf: true, fly: true, sun: false, city: GUESS[0], lon: GUESS[1], tz: GUESS[3] }, store.get(LS_VIEW, {}));
if (view.city == null) { const c0 = QC.find(+view.lon, null, +view.tz); view.city = c0 ? c0[0] : ''; }   // 旧存的只有经度
let form = { cal: 'solar', g: '男', name: '' };
let C = null;                 // 当前命盘
let sel = 0;                  // 选中宫（地支）
let taiji = null;             // 转宫太极点（地支），null = 本命
let flySrc = 'gong';          // 飞化来源：gong 宫干 / sheng 生年 / dx 大限 / ln 流年
let yunSel = { dx: null, ln: null, ly: null };   // dx = 大限宫地支, ln = 农历年, ly = 农历月
let Y = null;                 // 当前运限结果

/* ================ 起盘面板 ================ */
function seg(el, val, on) {
  el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === val));
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; seg(el, b.dataset.v, on); on(b.dataset.v); };
}
const CN_M = ['正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '冬', '腊'];
const CN_D = d => d <= 10 ? '初' + '一二三四五六七八九十'[d - 1] : d < 20 ? '十' + '一二三四五六七八九'[d - 11] : d === 20 ? '二十' : d < 30 ? '廿' + '一二三四五六七八九'[d - 21] : '三十';
$('lmIn').innerHTML = CN_M.map((m, i) => `<option value="${i + 1}">${m}月</option>`).join('');
$('ldIn').innerHTML = Array.from({ length: 30 }, (_, i) => `<option value="${i + 1}">${CN_D(i + 1)}</option>`).join('');
$('ltIn').innerHTML = Z.TIMES.map((t, i) => `<option value="${i}">${t}时 ${Z.TIME_RANGE[i]}</option>`).join('');
QC.mount($('cityIn'), { custom: '自定义经度' });
$('tzIn').innerHTML = QC.TZS.map(z => `<option value="${z}">${QC.tzLabel(z)}</option>`).join('');

function syncSunUI() {
  $('sunIn').checked = view.sun;
  $('lonIn').value = view.lon;
  $('tzIn').value = String(view.tz);
  $('cityIn').value = QC.byName(view.city) ? view.city : '';
  $('sunRow').setAttribute('aria-disabled', String(!view.sun));
}
function saveView() { store.set(LS_VIEW, view); }

function setCal(v) {
  form.cal = v; seg($('calSeg'), v, setCal);
  $('solarRow').hidden = v !== 'solar'; $('lunarRow').hidden = v !== 'lunar';
  $('sunRow').hidden = v !== 'solar';
}
seg($('calSeg'), 'solar', v => { setCal(v); });
seg($('genSeg'), '男', v => { form.g = v; cast(); });

// 公历输入 → 排盘参数（含真太阳时、时辰）
function solarInput() {
  const d = new Date($('whenIn').value);
  if (isNaN(d)) return null;
  let clock = d, sun = null;
  if (view.sun && isFinite(+view.lon)) { sun = Z.solarClock(d, +view.lon, +view.tz); clock = sun.date; }
  const h = clock.getHours();
  // 出生时刻（UTC）：钟点按出生地时区折算，交节换年月用它，不受真太阳时影响
  const ms = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes()) - (+view.tz) * 3600000;
  return { inp: { cal: 'solar', y: clock.getFullYear(), m: clock.getMonth() + 1, d: clock.getDate(), t: Z.timeIndexOf(h), g: form.g, ms }, clock, sun, raw: d };
}
function lunarInput() {
  const y = +$('lyIn').value;
  if (!(y >= 1900 && y <= 2100)) return null;
  return { inp: { cal: 'lunar', y, m: +$('lmIn').value, d: +$('ldIn').value, leap: $('leapIn').checked, t: +$('ltIn').value, g: form.g, tz: +view.tz } };
}
function readForm() { form.name = $('nameIn').value.trim(); return form.cal === 'solar' ? solarInput() : lunarInput(); }

function updateNotes(r) {
  const sn = $('shiNote'), dn = $('dstNote');
  if (form.cal !== 'solar' || !r) { sn.textContent = ''; dn.hidden = true; $('sunNote').textContent = ''; return; }
  sn.textContent = Z.TIMES[r.inp.t] + '时' + (r.sun ? `（真太阳时 ${pad(r.clock.getHours())}:${pad(r.clock.getMinutes())}）` : '');
  const sg = x => (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(1);
  $('sunNote').textContent = r.sun ? `经度${sg(r.sun.lonFix)} 均时差${sg(r.sun.eot)} 分` : '';
  const d = r.raw;
  // 出生地当年当时钟表实际用的时区（台湾日治 UTC+9、历年日光节约时间、大陆 1986–1991 夏令时……）；
  // 没开真太阳时就按设备所在地猜（时区相合才算）。紫微不认夏令时：要么减一小时，要么改时区
  const c = view.sun ? QC.byName(view.city) : GUESS[3] === +view.tz ? GUESS : null;
  const zc = c && QC.zoneCheck({ city: c, tz: +view.tz, dst: false, y: d.getFullYear(), mo: d.getMonth() + 1, d: d.getDate(), h: d.getHours(), mi: d.getMinutes() });
  if (zc && zc.kind === 'dst') {
    dn.hidden = false;
    dn.innerHTML = `${esc(zc.text.replace(/应勾「夏令时」。$/, '应减一小时。'))}<button class="fb-btn" type="button" id="dstBtn">减一小时</button>`;
    $('dstBtn').onclick = () => { const x = new Date(d.getTime() - 3600000); $('whenIn').value = toLocalInput(x); cast(); toast('已改为 ' + toLocalInput(x).replace('T', ' ')); };
  } else if (zc && zc.kind === 'tz') {
    dn.hidden = false;
    dn.innerHTML = `${esc(zc.text)}<button class="fb-btn" type="button" id="dstBtn">${esc(zc.btn)}</button>`;
    $('dstBtn').onclick = () => { view.tz = zc.fix.tz; saveView(); syncSunUI(); cast(true); toast('已' + zc.btn); };
  } else dn.hidden = true;
}

function cast(keep) {
  const r = readForm();
  if (!r) { toast('日期不对'); return; }
  try { C = Z.chart(r.inp); } catch (e) { toast('这一天排不出盘：' + e.message); return; }
  C.name = form.name; C.form = r;
  updateNotes(r);
  if (!keep) { sel = C.ming; taiji = null; yunSel = { dx: null, ln: null, ly: null }; }
  calcYun(); renderAll(); writeURL(); shareBirth(r);
}
// 命部 · 星命同参：起盘后把生辰记下，切到八字、占星时同一个人跟着走（fabao.js 的共享生辰）。
// 只看带过来的盘时不动出生地；开了真太阳时，或换了一个人，才把这里的经度、时区一并记下（紫微不认夏令时，新人记为标准时）。
function shareBirth(r) {
  if (!window.Fabao || !Fabao.birth) return;
  let when = $('whenIn').value;
  if (form.cal === 'lunar') {
    const m = /^(\d+)-(\d+)-(\d+)/.exec(C.info.solar || ''); if (!m) return;
    const t = r.inp.t, hh = t === 0 ? 0 : t === 12 ? 23 : t * 2;      // 取时辰中点
    when = `${m[1]}-${pad(+m[2])}-${pad(+m[3])}T${pad(hh)}:${t === 0 || t === 12 ? '30' : '00'}`;
  }
  const Bh = Fabao.birth, prev = Bh.load() || {};
  const base = { male: form.g === '男', name: form.name };
  // 带过来的若有夏令时，这里看到的是扣过一小时的标准时，仍算同一个人
  const prevStd = prev.dst ? Bh.minusHour(prev.when) : prev.when;
  if (prevStd === when) { Bh.save(Object.assign(base, view.sun ? { sun: true, lon: +view.lon, tz: +view.tz } : {})); return; }
  Bh.save(Object.assign(base, { when, dst: false, sun: !!view.sun, lon: +view.lon, tz: +view.tz }));
}

/* ================ 运限 ================ */
function calcYun() {
  Y = null;
  if (yunSel.ln != null) Y = Z.yun(C, yunSel.ln, yunSel.ly || null);
  else if (yunSel.dx != null) {
    const p = C.palaces[yunSel.dx];
    Y = Z.yun(C, C.info.lunarRaw.lunarYear + p.dx[0] - 1);
    Y.yearly = null; Y.age = null; Y.monthly = null;
  }
}
function curLunarYear() { return +Z.chart({ cal: 'solar', y: new Date().getFullYear(), m: new Date().getMonth() + 1, d: new Date().getDate(), t: 6, g: '男' }).info.lunarRaw.lunarYear; }
let NOW_LY = null;
function renderYun() {
  NOW_LY = NOW_LY || curLunarYear();
  const by = C.info.lunarRaw.lunarYear;
  const dxs = C.palaces.slice().sort((a, b) => a.dx[0] - b.dx[0]);
  const nowAge = NOW_LY - by + 1;
  $('dxRow').innerHTML = dxs.map(p => {
    const now = nowAge >= p.dx[0] && nowAge <= p.dx[1];
    return `<button data-br="${p.br}" class="${yunSel.dx === p.br ? 'on' : ''}"><b>${p.gan}${p.zhi}</b><span>${p.dx[0]}–${p.dx[1]}</span>${now ? '<i>今</i>' : ''}</button>`;
  }).join('');
  if (yunSel.dx == null) { $('lnRow').innerHTML = '<span class="fb-fine">先点一步大限</span>'; $('lyRow').innerHTML = ''; return; }
  const p = C.palaces[yunSel.dx];
  let h = '';
  for (let a = p.dx[0]; a <= p.dx[1]; a++) {
    const yr = by + a - 1, gz = Z.GAN[(yr - 4) % 10] + ZHI[(yr - 4) % 12];
    h += `<button data-y="${yr}" class="${yunSel.ln === yr ? 'on' : ''}"><b>${gz}</b><span>${yr} · ${a}岁</span>${yr === NOW_LY ? '<i>今</i>' : ''}</button>`;
  }
  $('lnRow').innerHTML = h;
  if (yunSel.ln == null) { $('lyRow').innerHTML = '<span class="fb-fine">再点流年可看流月</span>'; return; }
  $('lyRow').innerHTML = CN_M.map((m, i) => `<button data-m="${i + 1}" class="${yunSel.ly === i + 1 ? 'on' : ''}"><b>${m}月</b></button>`).join('');
}
$('dxRow').onclick = e => { const b = e.target.closest('button'); if (!b) return; const br = +b.dataset.br; yunSel = yunSel.dx === br ? { dx: null, ln: null, ly: null } : { dx: br, ln: null, ly: null }; if (yunSel.dx != null) sel = br; afterYun(); };
$('lnRow').onclick = e => { const b = e.target.closest('button'); if (!b) return; const y = +b.dataset.y; yunSel.ln = yunSel.ln === y ? null : y; yunSel.ly = null; afterYun(); if (Y && Y.yearly) sel = Y.yearly.br; renderAll(); };
$('lyRow').onclick = e => { const b = e.target.closest('button'); if (!b || !b.dataset.m) return; const m = +b.dataset.m; yunSel.ly = yunSel.ly === m ? null : m; afterYun(); if (Y && Y.monthly) sel = Y.monthly.br; renderAll(); };
function afterYun() {
  calcYun();
  if (flySrc === 'dx' && !(Y && Y.decadal)) flySrc = 'gong';
  if (flySrc === 'ln' && !(Y && Y.yearly)) flySrc = 'gong';
  renderAll();
}

/* ================ 盘面 ================ */
const vt = t => [...String(t)].map(c => `<span>${c}</span>`).join('');
function huaTag(h, cls, title) { return `<i class="hua h-${h} ${cls || ''}" title="${title || ''}">${h}</i>`; }
// 某层四化落到哪颗星：返回 {星名: 化}
function layerHua(list) { const m = {}; if (list) list.forEach((s, k) => { if (s) m[s] = Z.HUA[k]; }); return m; }

function starHTML(s, layers) {
  let tags = '';
  if (s.hua) tags += huaTag(s.hua, '', '生年化' + s.hua);
  layers.forEach(L => { const h = L.map[s.name]; if (h) tags += huaTag(h, L.cls, L.label + '化' + h); });
  if (s.self) tags += `<i class="hua self h-${s.self}" title="离心自化${s.self}">↑${s.self}</i>`;
  const tough = s.type === 'tough' ? ' tough' : '';
  return `<div class="zw-s ${s.kind}${tough}"><span class="n">${vt(s.name)}</span>${s.bright ? `<span class="b ${s.bright}">${s.bright}</span>` : ''}${tags}</div>`;
}

function cellName(p) {
  const tags = [];
  if (taiji != null) tags.push(`<b class="t-zh">${Z.zhuanName(C, taiji, p.br)}</b>`);
  if (Y && Y.decadal) tags.push(`<b class="t-dx">限${short(Y.decadal.names[p.br])}</b>`);
  if (Y && Y.yearly) tags.push(`<b class="t-ln">年${short(Y.yearly.names[p.br])}</b>`);
  if (Y && Y.monthly) tags.push(`<b class="t-ly">月${short(Y.monthly.names[p.br])}</b>`);
  return tags.join('');
}
function short(n) { const i = Z.PALACES.indexOf(n); return i >= 0 ? SHORT[i] : (n || '').slice(0, 1); }

function renderBoard() {
  const b = $('board');
  const sf = Z.sanfang(sel);
  const sfSet = new Set([sf.opp, sf.he[0], sf.he[1]]);
  const layers = [];
  if (Y && Y.decadal) layers.push({ map: layerHua(Y.decadal.hua), cls: 'dx', label: '大限' });
  if (Y && Y.yearly) layers.push({ map: layerHua(Y.yearly.hua), cls: 'ln', label: '流年' });
  if (Y && Y.monthly) layers.push({ map: layerHua(Y.monthly.hua), cls: 'ly', label: '流月' });
  const flies = currentFlies();
  const toSet = {}; flies.forEach(f => { if (f.to >= 0 && f.to !== f.from) toSet[f.to] = f.hua; });
  let h = '';
  for (let br = 0; br < 12; br++) {
    const p = C.palaces[br], [r, c] = POS[br];
    const yunStars = [];
    if (Y) ['decadal', 'yearly', 'monthly'].forEach(k => { if (Y[k] && Y[k].stars && Y[k].stars[br]) yunStars.push(...Y[k].stars[br]); });
    const cls = ['zw-cell', br === sel ? 'sel' : '', sfSet.has(br) && view.sf ? 'sf' : '', br === C.ming ? 'ming' : '', toSet[br] && view.fly ? 'to h-' + toSet[br] : ''].join(' ');
    h += `<div class="${cls}" data-br="${br}" style="grid-row:${r};grid-column:${c}" role="button" tabindex="0" aria-label="${p.name} ${p.gan}${p.zhi}">
      <button class="zw-dot${taiji === br ? ' on' : ''}" data-dot="${br}" title="${taiji === br ? '复原本命视角' : '以此宫为太极（转宫）'}" aria-label="转宫"></button>
      <div class="zw-stars">${p.major.map(s => starHTML(s, layers)).join('')}${p.minor.map(s => starHTML(s, layers)).join('')}${p.adj.map(s => starHTML(s, [])).join('')}${yunStars.map(n => `<div class="zw-s yun"><span class="n">${vt(n)}</span></div>`).join('')}</div>
      <div class="zw-foot">
        <div class="l"><span>${p.cs12}</span><span>${p.bs12}</span></div>
        <div class="c"><div class="zw-tags">${cellName(p)}</div><span class="pn">${p.name}${p.body ? '<sup>身</sup>' : ''}${p.laiyin ? '<sup>因</sup>' : ''}</span><span class="dx">${p.dx[0]}–${p.dx[1]}</span></div>
        <div class="r"><span class="gz">${vt(p.gan + p.zhi)}</span></div>
      </div>
    </div>`;
  }
  const I = C.info, nm = C.name ? esc(C.name) + ' · ' : '';
  const viewLine = [];
  if (taiji != null) viewLine.push(`转宫：以<b>${C.palaces[taiji].name}</b>为太极`);
  if (Y && Y.decadal) viewLine.push(`大限 ${Y.decadal.gan}${Y.decadal.zhi}（${C.palaces[Y.decadal.br].dx.join('–')}岁）`);
  if (Y && Y.yearly) viewLine.push(`流年 ${Y.yearly.gan}${Y.yearly.zhi} · 小限在${Y.age ? Y.age.zhi : ''}`);
  if (Y && Y.monthly) viewLine.push(`流月 ${Y.monthly.gan}${Y.monthly.zhi}`);
  h += `<div class="zw-center">
    <h2>${nm}${I.yinyang}<small>${I.zodiac} · ${I.sign}</small></h2>
    <div class="key"><span class="jin">${I.ju}</span> · 命主${I.soul} · 身主${I.body}</div>
    <div class="kv"><b>公历</b>${C.form.raw ? toLocalInput(C.form.raw).replace('T', ' ') : I.solar}${C.form.sun ? ` <span style="color:var(--faint)">真太阳时 ${pad(C.form.clock.getHours())}:${pad(C.form.clock.getMinutes())}</span>` : ''}</div>
    <div class="kv"><b>农历</b>${I.lunar}</div>
    <div class="kv"><b>四柱</b>${I.gz.join(' ')}</div>
    <div class="kv"><b>命身</b>命宫${C.palaces[C.ming].gan}${ZHI[C.ming]} · 身宫${ZHI[C.shen]}（${C.palaces[C.shen].name}）</div>
    <div class="zw-legend"><span class="h-禄"><i></i>禄</span><span class="h-权"><i></i>权</span><span class="h-科"><i></i>科</span><span class="h-忌"><i></i>忌</span><span><i class="o"></i>限</span><span><i class="o" style="box-shadow:none;border:1px dashed var(--muted)"></i>年</span></div>
    <div class="view">${viewLine.join('<br>') || '点宫看三方四正与飞化；点宫角小圈可转宫'}</div>
  </div>
  <svg class="zw-lines" id="lines" aria-hidden="true"></svg>`;
  b.innerHTML = h;
  b.classList.toggle('zw-adj-off', !view.adj);
  drawLines(flies);
}

// 每宫朝中宫的锚点
function anchorOf(br, rectB) {
  const el = $('board').querySelector(`.zw-cell[data-br="${br}"]`);
  const r = el.getBoundingClientRect();
  const [row, col] = POS[br];
  let x = r.left + r.width / 2, y = r.top + r.height / 2;
  if (row === 1) y = r.bottom; if (row === 4) y = r.top;
  if (col === 1) x = r.right; if (col === 4) x = r.left;
  return [x - rectB.left, y - rectB.top];
}
function drawLines(flies) {
  const svg = $('lines'); if (!svg) return;
  const rb = $('board').getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${rb.width} ${rb.height}`);
  let s = `<defs>${Z.HUA.map(h => `<marker id="ar-${h}" class="h-${h}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--hc)"/></marker>`).join('')}</defs>`;
  const A = br => anchorOf(br, rb);
  const cx = rb.width / 2, cy = rb.height / 2;
  if (view.sf) {
    const f = Z.sanfang(sel), a = A(sel), o = A(f.opp), h1 = A(f.he[0]), h2 = A(f.he[1]);
    s += `<path class="sf" d="M${a}L${h1}L${h2}Z"/><line class="sf-opp" x1="${a[0]}" y1="${a[1]}" x2="${o[0]}" y2="${o[1]}"/>`;
    s += [a, o, h1, h2].map(p => `<circle class="anchor" cx="${p[0]}" cy="${p[1]}" r="2.6"/>`).join('');
  }
  if (view.fly) {
    const count = {};
    flies.forEach(f => {
      if (f.to < 0 || f.to === f.from) return;
      const k = f.to; count[k] = (count[k] || 0) + 1; const n = count[k] - 1;
      const a = A(f.from), b = A(f.to);
      // 向中宫微弯，同一目标多条时错开
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      const bend = 0.28 + n * 0.16;
      const qx = mx + (cx - mx) * bend + n * 8, qy = my + (cy - my) * bend + n * 8;
      // 箭头停在目标锚点前 6px
      const dx = b[0] - qx, dy = b[1] - qy, L = Math.hypot(dx, dy) || 1;
      const ex = b[0] - dx / L * 6, ey = b[1] - dy / L * 6;
      const len = Math.round(Math.hypot(qx - a[0], qy - a[1]) + Math.hypot(ex - qx, ey - qy)) + 4;
      const lx = 0.25 * a[0] + 0.5 * qx + 0.25 * ex, ly = 0.25 * a[1] + 0.5 * qy + 0.25 * ey;
      s += `<g class="h-${f.hua}"><path class="fly draw" style="--len:${len}" d="M${a[0]},${a[1]} Q${qx},${qy} ${ex},${ey}" marker-end="url(#ar-${f.hua})"/>
        <g class="fly-lab"><rect x="${lx - 9}" y="${ly - 9}" width="18" height="18" rx="4"/><text x="${lx}" y="${ly}">${f.hua}</text></g></g>`;
    });
  }
  svg.innerHTML = s;
}

/* ---------- 以事定时（禁制） ---------- */
// 脚本加密放在 /ziwei/dingshi.json（scripts/lock/encrypt-data.mjs 写入），与八字、占星读盘同盐同口诀，钥匙存 lock_key_mingbu
const DS_KEY = 'lock_key_mingbu';
let dsBox = null, dsBusy = false, dsCtx = null;
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const dsGet = () => { try { return localStorage.getItem(DS_KEY); } catch (e) { return null; } };
const dsSet = v => { try { v ? localStorage.setItem(DS_KEY, v) : localStorage.removeItem(DS_KEY); } catch (e) { /* 无痕模式 */ } };
async function dsLoad() { if (!dsBox) { const r = await fetch('/ziwei/dingshi.json'); if (!r.ok) throw new Error('fetch'); dsBox = await r.json(); } return dsBox; }
async function dsOpen(raw) {
  const B = await dsLoad();
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(B.iv) }, k, b64d(B.data));
  new Function(new TextDecoder().decode(plain))();     // 定义 window.ZW_DINGSHI
}
function dsLockHTML(msg) {
  return `<form class="dp-lock" id="dsLock" autocomplete="off"><div class="fb-seal" aria-hidden="true">禁</div><p class="dp-lock-t">此段被阁主下了<span class="jin">禁制</span></p>` +
    `<input type="password" id="dsPw" placeholder="解禁口诀" aria-label="解禁口诀"><label class="zw-chk"><input type="checkbox" id="dsKeep" checked> 此设备记住</label>` +
    `<button class="fb-btn primary" id="dsGo">解 禁</button><p class="dp-msg" role="status">${esc(msg || '')}</p></form>`;
}
function renderDingshi(rows, R) {
  dsCtx = { Z, C, rows, ranges: R, male: form.g === '男', key: twoKey(), JSK, chartT, esc };
  const box = $('dsBox');
  if (window.ZW_DINGSHI) { window.ZW_DINGSHI.render(box, dsCtx); return; }
  const saved = dsGet();
  if (!saved || dsBusy) { if (!dsBusy) { box.innerHTML = dsLockHTML(); bindDsLock(); } return; }
  dsBusy = true; box.innerHTML = '<p class="fb-fine">解禁中…</p>';
  dsOpen(b64d(saved).buffer).then(() => { dsBusy = false; window.ZW_DINGSHI.render($('dsBox'), dsCtx); })
    .catch(e => { dsBusy = false; if (!(e && e.message === 'fetch')) dsSet(null); $('dsBox').innerHTML = dsLockHTML(e && e.message === 'fetch' ? '经文没取到，联网后再试' : ''); bindDsLock(); });
}
function bindDsLock() {
  const f = $('dsLock'); if (!f) return;
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('dsGo'), msg = f.querySelector('.dp-msg'); btn.disabled = true; msg.textContent = '';
    try {
      const B = await dsLoad();
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('dsPw').value), 'PBKDF2', false, ['deriveBits']);
      const raw = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64d(B.salt), iterations: B.iter }, base, 256);
      await dsOpen(raw);
      dsSet($('dsKeep').checked ? b64e(raw) : null);
      window.ZW_DINGSHI.render($('dsBox'), dsCtx);
    } catch (err) { msg.textContent = err && err.message === 'fetch' ? '经文没取到，联网后再试' : '口诀不对，禁制未动'; btn.disabled = false; }
  });
}

};
const BRIGHT_TXT = { 庙: '入庙', 旺: '旺', 得: '得地', 利: '利', 平: '平', 不: '不得地', 陷: '落陷' };
const HUA_TXT = { 禄: '化禄添人缘福气', 权: '化权添主见魄力', 科: '化科添名声条理', 忌: '化忌多执着牵挂' };
const SHEN_TXT = {
  命宫: '先天个性与后天作为一致，个性鲜明、主观较强', 夫妻: '后天重心在婚姻与伴侣，受另一半影响大',
  财帛: '后天心力多放在赚钱理财上，重实际', 迁移: '好动，常在外奔波，出外发展的机会多',
  官禄: '以事业为重心，看重成就与名位', 福德: '重精神生活与内心感受，讲究生活品味'
};
const JI6 = ['左辅', '右弼', '文昌', '文曲', '天魁', '天钺'], SHA6 = ['擎羊', '陀罗', '火星', '铃星', '地空', '地劫'];
const bhRow = (k, html) => `<div class="r"><i>${k}</i><span>${html}</span></div>`;
let bhOf = null;
function renderBH() {
  if (bhOf === C) return;          // 点宫、转宫、运限都会 renderAll，白话只随命盘变
  bhOf = C;
  const p = C.palaces[C.ming], o = C.palaces[Z.sanfang(C.ming).opp], sh = C.palaces[C.shen];
  const tag = s => [BRIGHT_TXT[s.bright], s.hua ? '化' + s.hua : ''].filter(Boolean).join('、');
  const stars = list => list.map(s => `<b>${s.name}</b>${tag(s) ? `（${tag(s)}）` : ''}`).join('、');
  const use = p.major.length ? p.major : o.major;           // 命宫无主星，借对宫（迁移）的星来看
  const ji = p.minor.filter(s => JI6.includes(s.name)).map(s => s.name), sha = p.minor.filter(s => SHA6.includes(s.name)).map(s => s.name);
  let ming = p.major.length ? `在${p.zhi}，坐${stars(p.major)}`
    : o.major.length ? `在${p.zhi}，无主星（空宫），借对宫迁移宫（${o.zhi}）的${stars(o.major)}来看；空宫的人可塑性大，较受环境影响`
      : `在${p.zhi}，无主星，对宫也无主星，宜合三方的财帛、官禄一起看`;
  if (ji.length || sha.length) ming += '；同宫另有' + [ji.length ? '吉星' + ji.join('、') : '', sha.length ? '煞星' + sha.join('、') : ''].filter(Boolean).join('，');
  const hua = [...new Set(use.map(s => s.hua).filter(Boolean))];
  $('bhCard').innerHTML = `<div class="bh-h"><span class="fb-tag">白话</span><small>一眼看个大概 · 参考</small></div>` +
    bhRow('命宫', ming + '。') +
    (use.length ? bhRow('性情', use.map(s => `<b>${s.name}</b>：${STAR_TXT[s.name] || '—'}`).join('；') + (p.major.length ? '。' : '。借来的星，力道打些折扣。')) : '') +
    bhRow('身宫', C.shen === C.ming ? `与命宫同在${p.zhi}（命身同宫），${SHEN_TXT.命宫}。` : `在${sh.name.endsWith('宫') ? sh.name : sh.name + '宫'}（${sh.zhi}），${SHEN_TXT[sh.name] || '后天重心多在' + sh.name + '之事'}。`) +
    bhRow('五行局', `${C.info.ju}：大限从 ${p.dx[0]} 岁起排，每十年换一步。`) +
    `<p class="fb-fine">亮度：入庙、旺最得力，得地、利尚可，平为平常，不得地、落陷较失力${hua.length ? '；' + hua.map(h => HUA_TXT[h]).join('，') : ''}。皆为常见说法，参考。</p>`;
  $('bhCard').hidden = false;
}

$('board').addEventListener('click', e => {
  const dot = e.target.closest('[data-dot]');
  if (dot) { e.stopPropagation(); setTaiji(+dot.dataset.dot); return; }
  const c = e.target.closest('.zw-cell'); if (!c) return;
  sel = +c.dataset.br; renderAll();
});
$('board').addEventListener('keydown', e => {
  const c = e.target.closest('.zw-cell'); if (!c || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault(); sel = +c.dataset.br; renderAll();
  const again = $('board').querySelector(`.zw-cell[data-br="${sel}"]`); if (again) again.focus();
});
let rz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => C && drawLines(currentFlies())); });

/* ================ 盘库 · 复制 · 网址 ================ */
function formSnapshot() {
  return form.cal === 'solar'
    ? { cal: 'solar', when: $('whenIn').value, g: form.g, name: form.name, sun: view.sun ? { lon: +view.lon, tz: +view.tz } : null }
    : { cal: 'lunar', y: +$('lyIn').value, m: +$('lmIn').value, d: +$('ldIn').value, leap: $('leapIn').checked, t: +$('ltIn').value, g: form.g, name: form.name };
}
function applySnapshot(s) {
  setCal(s.cal); form.g = s.g || '男'; seg($('genSeg'), form.g, v => { form.g = v; cast(); });
  $('nameIn').value = s.name || '';
  if (s.cal === 'solar') {
    $('whenIn').value = s.when;
    if (s.sun) { const c = QC.find(+s.sun.lon, null, +s.sun.tz); view.sun = true; view.lon = s.sun.lon; view.tz = s.sun.tz; view.city = c ? c[0] : ''; } else view.sun = false;
    syncSunUI();
  } else {
    $('lyIn').value = s.y; $('lmIn').value = s.m; $('ldIn').value = s.d; $('leapIn').checked = !!s.leap; $('ltIn').value = s.t;
  }
  cast();
}
function renderLib() {
  const lib = store.get(LS_LIB, []);
  $('libSel').innerHTML = `<option value="">盘库（${lib.length ? '存过 ' + lib.length + ' 盘' : '尚无存盘'}）</option>` +
    lib.map((e, i) => `<option value="${i}">${esc(e.name || '无名')} · ${e.cal === 'solar' ? e.when.replace('T', ' ') : `农历${e.y}-${e.m}-${e.d}`} ${e.g}</option>`).join('') +
    (lib.length ? '<option value="del">删去当前这盘…</option>' : '');
}
$('saveBtn').onclick = () => {
  if (!C) return;
  const s = formSnapshot(), lib = store.get(LS_LIB, []);
  const sig = e => JSON.stringify(Object.assign({}, e, { name: '', saved: 0 }));
  const i = lib.findIndex(e => sig(e) === sig(s));
  s.saved = Date.now();
  if (i >= 0) lib[i] = s; else lib.unshift(s);
  store.set(LS_LIB, lib.slice(0, 200)); renderLib(); toast('已存入盘库（只存在这台设备）');
};
let libCur = -1;
$('libSel').onchange = () => {
  const v = $('libSel').value, lib = store.get(LS_LIB, []);
  if (v === 'del') {
    if (libCur >= 0 && lib[libCur] && confirm(`删去「${lib[libCur].name || '无名'}」这盘？`)) { lib.splice(libCur, 1); store.set(LS_LIB, lib); libCur = -1; toast('已删'); }
    else toast('先从盘库里选一盘');
    renderLib(); return;
  }
  if (v === '') return;
  libCur = +v; applySnapshot(lib[libCur]);
  renderLib(); $('libSel').value = String(libCur);
};
// 盘面文字：「复制」与「问 AI」共用
function chartText() {
  const I = C.info, L = [];
  L.push(`紫微斗数 · ${C.name || '命盘'} · ${I.yinyang}`);
  L.push(`公历 ${C.form.raw ? toLocalInput(C.form.raw).replace('T', ' ') : I.solar}${C.form.sun ? `（真太阳时 ${pad(C.form.clock.getHours())}:${pad(C.form.clock.getMinutes())}）` : ''} · 农历 ${I.lunar}`);
  L.push(`四柱 ${I.gz.join(' ')} · ${I.ju} · 命主${I.soul} 身主${I.body}`);
  for (let k = 0; k < 12; k++) {
    const br = (C.ming - k + 12) % 12, p = C.palaces[br];
    const st = list => list.map(s => s.name + (s.bright || '') + (s.hua ? '化' + s.hua : '') + (s.self ? '(自化' + s.self + ')' : '')).join(' ');
    L.push(`${p.name}${p.body ? '(身)' : ''} ${p.gan}${p.zhi} ${p.dx[0]}-${p.dx[1]}｜${st(p.major) || '空宫'}｜${st(p.minor)}`);
  }
  return L.join('\n');
}
$('copyBtn').onclick = () => { if (C) copy(chartText(), '命盘已复制'); };
// 问 AI：盘面文字再补今年所行大限，及盘上正看的运限四化，连同本页口径一并复制
function aiText() {
  const L = [chartText()];
  NOW_LY = NOW_LY || curLunarYear();
  const age = NOW_LY - C.info.lunarRaw.lunarYear + 1, p = C.palaces.find(q => age >= q.dx[0] && age <= q.dx[1]);
  L.push(`今年 农历${NOW_LY}年（${Z.GAN[(NOW_LY - 4) % 10]}${ZHI[(NOW_LY - 4) % 12]}），虚岁 ${age}` + (p ? `，行${p.name}大限（${p.gan}${p.zhi}，${p.dx[0]}–${p.dx[1]} 岁）` : ''));
  if (Y) {
    const lay = (s, n) => s ? `${n}${s.gan}${s.zhi}（命宫在${s.zhi}）四化 ${(s.hua || []).map((x, k) => x ? x + Z.HUA[k] : '').filter(Boolean).join(' ')}` : '';
    const parts = [lay(Y.decadal, '大限'), lay(Y.yearly, '流年'), lay(Y.monthly, '流月')].filter(Boolean);
    if (parts.length) L.push('盘上正看 ' + parts.join('；'));
  }
  return L.join('\n');
}
function rulesText() {
  return [
    '安星引擎为开源的 iztro；以正月初一换年；闰月以十五为界，前半归本月、后半归下月；晚子时（23 点后）作次日子时。',
    '四化：庚干取「阳武阴同」（太阳禄、武曲权、太阴科、天同忌）；星曜庙旺依《斗数全书》。',
    `中宫四柱为八字口径：年以立春、月以节的交节时刻换。${C.form && C.form.sun ? '时辰已按出生地真太阳时定。' : ''}出生地当年的夏令时（台湾日光节约时间、大陆 1986–1991 等）只提示，不自动扣。`,
    '十二宫自命宫起逆行；「(身)」为身宫，「自化」为本宫宫干化本宫之星；各宫后为宫干支与大限岁数。'
  ].join('\n');
}
$('aiBtn').onclick = () => { if (C) Fabao.askAI('紫微斗数', aiText(), rulesText()); };
// 分享图：题为命宫主星，金句与几行取白话卡；不写生辰，只写五行局与命主身主
$('shareBtn').onclick = () => {
  if (!C) { toast('先排一盘'); return; }
  const p = C.palaces[C.ming], I = C.info;
  Fabao.share({ title: `命宫在${p.zhi} · ${p.major.length ? p.major.map(s => s.name).join('') : '空宫'}`, meta: `${I.ju} · 命主${I.soul} · 身主${I.body}`, url: location.origin + '/ziwei/', qrLabel: '扫码也排一盘' });
};
function writeURL() {
  const s = formSnapshot(), q = new URLSearchParams();
  if (s.cal === 'solar') { q.set('d', s.when); if (s.sun) { q.set('lon', s.sun.lon); q.set('tz', s.sun.tz); } }
  else { q.set('l', `${s.y}-${s.m}-${s.d}`); q.set('t', s.t); if (s.leap) q.set('leap', '1'); }
  q.set('g', s.g); if (s.name) q.set('n', s.name);
  history.replaceState(null, '', '?' + q.toString());
}
function readURL() {
  const q = new URLSearchParams(location.search);
  if (q.get('d')) {
    const s = { cal: 'solar', when: q.get('d'), g: q.get('g') || '男', name: q.get('n') || '' };
    if (q.get('lon')) s.sun = { lon: +q.get('lon'), tz: +(q.get('tz') || 8) };
    return s;
  }
  if (q.get('l')) {
    const [y, m, d] = q.get('l').split('-').map(Number);
    return { cal: 'lunar', y, m, d, leap: q.get('leap') === '1', t: +(q.get('t') || 0), g: q.get('g') || '男', name: q.get('n') || '' };
  }
  return null;
}

/* ================ 绑定 ================ */
$('whenIn').addEventListener('change', () => cast());
$('nowBtn').onclick = () => { const d = new Date(); d.setSeconds(0, 0); $('whenIn').value = toLocalInput(d); cast(); };
['lyIn', 'lmIn', 'ldIn', 'leapIn', 'ltIn'].forEach(id => $(id).addEventListener('change', () => cast()));
$('nameIn').addEventListener('change', () => { if (C) { C.name = $('nameIn').value.trim(); form.name = C.name; renderBoard(); writeURL(); } });
$('castBtn').onclick = () => cast();
$('sunIn').onchange = () => { view.sun = $('sunIn').checked; saveView(); syncSunUI(); cast(true); };
$('cityIn').onchange = () => { const c = QC.byName($('cityIn').value); if (c) { view.city = c[0]; view.lon = c[1]; view.tz = c[3]; view.sun = true; saveView(); syncSunUI(); cast(true); } else { view.city = ''; saveView(); $('lonIn').focus(); } };
$('lonIn').onchange = () => { const v = parseFloat($('lonIn').value); if (isFinite(v) && v >= -180 && v <= 180) { view.lon = Math.round(v * 100) / 100; view.city = ''; saveView(); syncSunUI(); cast(true); } else toast('经度应在 −180 到 180 之间'); };
$('tzIn').onchange = () => { view.tz = +$('tzIn').value; saveView(); cast(true); };
['adjIn', 'sfIn', 'flyIn'].forEach(id => $(id).onchange = () => { view.adj = $('adjIn').checked; view.sf = $('sfIn').checked; view.fly = $('flyIn').checked; saveView(); renderBoard(); });
$('adjIn').checked = view.adj; $('sfIn').checked = view.sf; $('flyIn').checked = view.fly;
$('twoIn').checked = !!view.two;
$('twoIn').onchange = () => { view.two = $('twoIn').checked; saveView(); twoT = null; renderTwo(); if (view.two) $('twoCard').scrollIntoView({ behavior: 'smooth', block: 'start' }); };

// 农历框默认填今年
$('lyIn').value = new Date().getFullYear();
syncSunUI(); renderLib();
const fromURL = readURL();
if (fromURL) applySnapshot(fromURL);
else { const d = new Date(); d.setSeconds(0, 0); $('whenIn').value = toLocalInput(d); setCal('solar'); cast(); }
})();
</script>
