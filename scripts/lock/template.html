<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#17131F">
<title>禁制 · 潜蛟阁法宝库</title>
<link rel="icon" href="/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=LXGW+WenKai+TC&family=Archivo:wdth,wght@125,500;125,800&display=swap">
<link rel="stylesheet" href="/fabao/fabao.css?v=1">
<style>
  /* 禁制锁屏：沿用法宝库外框（/fabao/），只多一方「禁」印和口诀框 */
  .lock-wrap { min-height: calc(100vh - var(--top-h) - 100px); display: grid; place-items: center; }
  .lock { width: 100%; max-width: 360px; padding: 32px 28px 26px; text-align: center; }
  .lock .fb-seal { margin: 0 auto 18px; width: 60px; height: 60px; font-size: 34px; background: var(--zhu); transform: rotate(-8deg); box-shadow: 0 8px 24px -8px rgba(224,122,98,.7); }
  .lock h1 { font-family: var(--font-title); font-weight: 600; font-size: 20px; letter-spacing: .2em; }
  .lock h1 .jin { color: var(--jin); }
  .lock .fb-sub { margin: 6px 0 22px; }
  .lock input[type=password] { width: 100%; text-align: center; font-size: 16px; letter-spacing: .3em; padding: 11px 12px; }
  .lock label { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 12px 0 16px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .lock label input { accent-color: var(--zi); }
  #msg { min-height: 1.5em; margin-top: 12px; font-size: 13px; color: var(--zhu); }
  button:disabled { opacity: .6; cursor: wait; }
</style>
</head>
<body data-tool="{{TOOL}}">
<main class="fb-main">
  <div class="lock-wrap">
    <form id="f" class="fb-card lock" autocomplete="off">
      <div class="fb-seal">禁</div>
      <h1>此宝被阁主下了<span class="jin">禁制</span></h1>
      <div class="fb-sub">{{SUB}}</div>
      <input type="password" id="pw" placeholder="解禁口诀" autofocus aria-label="解禁口诀">
      <label><input type="checkbox" id="keep" checked> 此设备记住</label>
      <button id="go" class="fb-btn primary block">解 禁</button>
      <p id="msg"></p>
    </form>
  </div>
</main>
<script src="/fabao/fabao.js?v=5"></script>
<script>
(function () {
  // 加密数据由 scripts/lock/encrypt.mjs 写入，原文不在仓库中
  var BOX = /*BOX*/null/*BOX*/;
  var KEY_STORE = 'lock_key_' + BOX.id;
  var enc = new TextEncoder();
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function b64e(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }

  async function deriveRaw(pw) {
    var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(BOX.salt), iterations: BOX.iter }, base, 256);
  }
  async function open(raw) {
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(BOX.iv) }, key, b64(BOX.data));
    var html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }
  function get() { try { return localStorage.getItem(KEY_STORE); } catch (e) { return null; } }
  function set(v) { try { v ? localStorage.setItem(KEY_STORE, v) : localStorage.removeItem(KEY_STORE); } catch (e) {} }

  var saved = get();
  // 页面解析完再替换文档，否则 document.open 可能不生效
  if (saved) {
    document.documentElement.style.visibility = 'hidden';
    var auto = function () {
      open(b64(saved).buffer).catch(function () {
        set(null);
        document.documentElement.style.visibility = '';
      });
    };
    if (document.readyState === 'complete') auto(); else window.addEventListener('load', auto);
  }

  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('go'), msg = document.getElementById('msg');
    btn.disabled = true; msg.textContent = '';
    try {
      var keep = document.getElementById('keep').checked;
      var raw = await deriveRaw(document.getElementById('pw').value);
      await open(raw);
      set(keep ? b64e(raw) : null);
    } catch (err) {
      msg.textContent = '口诀不对，禁制未动';
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
