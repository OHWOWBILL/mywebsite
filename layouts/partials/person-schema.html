{{- /* Person 实体 · 数据源 data/identity.toml
       稳定 @id 让各页面的引用被搜索引擎合并为同一实体。
       所有页面（含首页）经 extend-head.html 调用本 partial。 */ -}}
{{- with site.Data.identity -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": "{{ site.BaseURL }}#person",
  "name": {{ .name | jsonify }},
  "alternateName": {{ .alternateName | jsonify }},
  {{ with .description }}"description": {{ . | jsonify }},{{ end }}
  {{ with .knowsAbout }}"knowsAbout": {{ . | jsonify }},{{ end }}
  "url": {{ site.BaseURL | jsonify }},
  "mainEntityOfPage": {{ site.BaseURL | jsonify }},
  "sameAs": [{{ range $i, $p := .profile }}{{ if $i }},{{ end }}{{ $p.url | jsonify }}{{ end }}]
}
</script>
{{- end -}}
